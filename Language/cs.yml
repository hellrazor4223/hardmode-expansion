  STR_WASPITE_UFOPEDIA: "Vosáci jsou elitní terorističtí agenti a bojovníci. Jde o velmi agresivní, geneticky vyšlechtěné a kyberneticky vylepšené tvory, což z nich činí obávané nepřátele. Jejich celková křehkost však napovídá, že plní spíše úlohu dělostřelectva než pěchoty. Spirálovité zařízení nahrazující jejich původní tělo vytváří antigravitační pole, které jim umožňuje vznášet se ve vzduchu."
