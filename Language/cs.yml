  STR_HYPER_WAVE_DECODER_UFOPEDIA: "Cizácká komunikace využívá naddimenzionální vlnu, která se šíří téměř okamžitě. Dekodér zachycuje vysílání UFO a rozpoznává přenášené informace. Zobrazí typ UFO, cizáckou rasu a druh činnosti. K výstavbě potřebujeme cizácké materiály.{NEWLINE}{NEWLINE}Potřebné cizácké stavební materiály:{NEWLINE} * CIZÁCKÉ SLITINY: 60{NEWLINE} * ELERIUM-115: 30{NEWLINE} * NAVIGACE UFO: 4"
