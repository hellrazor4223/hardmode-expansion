#BEGIN BRIEFINGS
  STR_INITIAL_BRIEFING: "Úvodní briefing"
  STR_INITIAL_BRIEFING_UFOPEDIA: "Píše se rok 1999 až znepokojivě často se na noční obloze začaly objevovat neidentifikované létající objekty (UFO).{NEWLINE}Strach v lidských srdcích rozpoutalo množství hlášení o násilných únosech a příšerných pokusech na lidech z odlehlých oblastech. Hlášení začala být čím dál tím více častější a přichází ze všech koutů Země.{NEWLINE}Nastalá masová hysterie ještě prohloubila neschopnost Země vzdorovat pokročilejším technologiím. Odpovědí světových vlád bylo uvedení armád do válečného stavu a masová cenzura novin v nehůře postižených zemích. Vědci se pokoušejí s cizáky navázat kontakt, ale zatím bez odpovědi."

  STR_KIRYU_KAI: "Kiryu-Kai"
  STR_KIRYU_KAI_UFOPEDIA: "Mnoho zemí zvažuje přímý vojenský úder proti okupantům a snaží se nezávisle na ostatních cizáky kontaktovat. V srpnu 1998 vytvořilo Japonsko proticizáckou jednotku Kiryu-Kai. Díky nejnovějšímu japonskému stíhači se zdálo, že se jedná o silnou jednotku. Ale teprve až po 5 měsících náročných operací se jim podařilo utkat se s prvním UFO.{NEWLINE}Závěr je křišťálově jasný - jedná se o celosvětový problém, se kterým si vlády jednotlivě neporadí."

  STR_EXTRATERRESTRIAL_COMBAT_UNIT: "X-Com"
  STR_EXTRATERRESTRIAL_COMBAT_UNIT_UFOPEDIA: "V prosinci 1998 se sešly vlády ekonomicky nejsilnějších zemí v Ženevě. Po sálodlouhých jednáních se jim podařilo založit utajenou nezávislou organizaci, jejíž posláním je vyšetřování, boj a porážka cizácké hrozby. Organizace dostane k dispozici ty nejlepší piloty, vojáky, vědce a inženýry celého světa.{NEWLINE}Organizace dostala název Extraterrestrial Combat Unit (jednotka pro boj s mimozemšťany), zkráceně X-Com."

  STR_SOLDIER_ARMOR_REPAIR: "Opravy zbrojí vojáků"
  STR_SOLDIER_ARMOR_REPAIR_UFOPEDIA: "Protože náš rozpočet není nafukovací, je důležité udržovat zbroje všech našich vojáků v bezvadném stavu. Pokud se nám podaří z bojiště do základny přepravit tělo zabitého vojáka, můžeme dát jeho zbroj do pořádku."

  STR_TANK_REPAIR: "Opravy TZS"
  STR_TANK_REPAIR_UFOPEDIA: "Po úvodní debatě vědeckého týmu s hlavním inženýrem jsme zavedli postupy pro opravu všech zničených TZS, pokud se jejich vraky podaří zajistit po úspěšné pozemní misi. Náklady na opravu činí přibližně 50 % původních výrobních nákladů dané jednotky."

  STR_EXPLOSIVE_AMMO: "Výbušná munice"
  STR_EXPLOSIVE_AMMO_UFOPEDIA: "Naše vyspělé pěchotní zbraně, Těžký kanón a Gatling, mohou nyní používat také výbušné náboje způsobující explozivní poškození. Hlavnímu dodavateli zbraní jsme předali plány a technické výkresy potřebné k výrobě tohoto druhu munice."

  STR_ALLOY_AMMO: "Munice z cizácké slitiny"
  STR_ALLOY_AMMO_UFOPEDIA: "Díky znalostem zpracování mimořádně pevných a přitom lehkých cizáckých slitin nyní dokážeme vyrábět střely, které se nerozpadnou ani při vyšších úsťových rychlostech. Lze je vystřelovat z nábojnic z cizácké slitiny, které jsou lehčí a současně pevnější než vše, co jsme dosud dokázali vyrobit."

  STR_EHE_AMMO: "Vylepšená výbušná munice"
  STR_EHE_AMMO_UFOPEDIA: "Spojení nábojnic z cizáckých slitin s nově objeveným prvkem Elerium-115 nám umožňuje vyrábět pro konvenční Těžký kanón a Gatling mnohem ničivější výbušné náboje s plošným účinkem. Při použití této munice v uzavřených prostorách doporučujeme nejvyšší opatrnost a důrazně radíme nosit zbroj."

  STR_LASER_WEAPONS: "Laserové zbraně"
  STR_LASER_WEAPONS_UFOPEDIA: "Lasery známe již desítky let. Objev cizáckých slitin a informace o optice nalezené v Cizácké datové tabulce nyní lidstvu poprvé umožňují navrhnout prakticky použitelné laserové zbraně. Ve většině ohledů překonávají kinetické zbraně a našim jednotkám výrazně pomohou v boji proti cizákům."

  STR_ALLOY_AIRFRAME: "Trup z cizácké slitiny"
  STR_ALLOY_AIRFRAME_UFOPEDIA: "Naše základní znalosti tvarování nově objevených cizáckých slitin by nám mohly umožnit vyrábět zdokonalené trupy letounů. První prioritou by mělo být vylepšení transportních strojů. Jakmile dokončíme počáteční zkoušky zesílených trupů, můžeme zahájit vývoj trupu stíhacího letounu z cizácké slitiny."

  STR_SUPPORT_DRONES: "Podpůrné drony"
  STR_SUPPORT_DRONES_UFOPEDIA: "Na rozdíl od prvních automatizovaných těžkých zbraňových systémů sledují tyto malé roboty na bojišti jiný cíl: průzkum a nepřímou podporu jednotek. Na svou velikost mají elegantní konstrukci a důkladné pancéřování. Získávání informací přímo na bojišti výrazně zvýší bojové schopnosti našich jednotek a pomůže snížit ztráty. Inženýři se domnívají, že drony dokážeme vybavit také detektory, zdravotnickým zařízením a omračovači."

  STR_ALLOY_DRONE_ARMOR: "Zbroj slitinového dronu"
  STR_ALLOY_DRONE_ARMOR_UFOPEDIA: "Inženýři konečně zdokonalili naše postupy zpracování cizáckých slitin natolik, že jimi můžeme vybavit i drony. Slitinová zbroj výrazně zvýší jejich ochranu, rychlost a odolnost na bojišti. Zároveň se podařilo zvýšit výkon a kapacitu veškerého doplňkového vybavení. Obsluha Dronu/detektoru, Dronu/medkitu a Dronu/omračovače nyní zabere méně času a jejich vybavení má více použití. Doufáme, že tento pokrok dále sníží naše vysoké ztráty."

  STR_HOVERDRONE_ARMOR: "Zbroj vznášivého dronu"
  STR_HOVERDRONE_ARMOR_UFOPEDIA: "Kung-fu, umění dosáhnout dokonalosti v jediné věci, nás dovedlo až sem. Vylepšení konstrukčních postupů a důkladná znalost stavby strojů a těžkých zbraňových systémů podle cizáckých technologií nám umožnily dát podpůrným dronům novou výhodu: trojrozměrnou pohyblivost. Jejich zbroj se navíc téměř vyrovná našim vznášivým TZS. V určitém dosahu mohou drony vytvářet kouřovou clonu také ze vzduchu."

  STR_ALLOY_TANK_ARMOR: "Zbroj slitinového TZS"
  STR_ALLOY_TANK_ARMOR_UFOPEDIA: "Úspěšné využití cizáckých slitin ke zlepšení našich schopností stíhání a letecké přepravy přivedlo jeden z inženýrských týmů na způsob, jak nové znalosti uplatnit také u těžkých zbraňových systémů. Po počátečním výzkumu jsme dokázali pomocí cizáckých slitin zvýšit jejich odolnost i rychlost. Vedlejším přínosem bylo zdokonalení zaměřovacích modulů, a tedy i přesnosti a reakcí TZS."

  STR_HOVERTANK: "Vznášivé těžké zbraňové systémy (VTZS)"
  STR_HOVERTANK_UFOPEDIA: "Po úspěšném napodobení základních principů cizáckých plavidel začaly výzkumné a inženýrské týmy přizpůsobovat nové technologie našim těžkým zbraňovým systémům. Výsledkem je schopnost vyrábět létající TZS s vyšší pohyblivostí a lepšími možnostmi průzkumu a vyhledávání cílů."

  STR_WALKERTANK: "Kráčející těžké zbraňové systémy (KTZS)"
  STR_WALKERTANK_UFOPEDIA: "Potvrdila se i nejneuvěřitelnější teorie o tom, jak cizáci ovládají tyto obří kráčející stroje smrti. Mezi biologickými cizáckými jednotkami a roboty vzniká psionické spojení fungující v omezené oblasti kolem UFO a cizáckých základen nebo během probíhající pozemní mise. Principu již rozumíme natolik, že se můžeme pokusit toto spojení odstranit: znovu spustit jednotku vyřazenou na bojišti, proniknout do jejího řízení a obrátit ji proti bývalým pánům. K pokusu potřebujeme živého Sektopoda nebo obrněného Sektopoda a znalost jeho hlavní výzbroje."
#END BRIEFINGS

#BEGIN NEWS
  STR_NEWS_1: "Nejnovější zprávy ze světa"
  STR_NEWS_1_UFOPEDIA: "* Po zásahu domu 'energetickou zbraní' hlásí malá africká vesnice tři potvrzené oběti.{NEWLINE}* Znepokojivý počet záhadných zmizení v Kapském Městě děsí místní obyvatele.{NEWLINE}* Mladík z Berlína tvrdí, že se setkal s nadřazenými mimozemskými bytostmi. Údajně mu řekly, aby se připravil na velké věci, které přijdou, na velkou očistu.{NEWLINE}* Mediální společnosti z celého světa soupeří o žádané záběry živých cizáků.{NEWLINE}* U Tijuany se shromažďují davy, aby pozorovaly neobvyklá světla nepravidelně létající nad městem.{NEWLINE}* Údajné oběti únosů tvrdí, že je zajaly růžové létající humanoidní bytosti v pláštích."

  STR_NEWS_2: "Nejnovější zprávy ze světa"
  STR_NEWS_2_UFOPEDIA: "* Místní média pobouřila rostoucí cenzura informací o činnosti ruské vlády.{NEWLINE}* Soupeřící politické a ideologické skupiny se navzájem obviňují z nepřátelství cizáků.{NEWLINE}* Už nejsme sami - dokument tvrdí, že má 'výhradní' informace o záměrech cizáků se Zemí.{NEWLINE}* Královská astronomická společnost připisuje nedávná pozorování neobvyklých světel silné sluneční erupci.{NEWLINE}* Ruská popová zpěvačka nabízí cizákům, že ji 'mohou unést'... údajní vetřelci dosud nereagovali.{NEWLINE}* Obyvatelé Dublinu hlásí velké dvounohé predátory napadající dobytek."

  STR_NEWS_3: "Nejnovější zprávy ze světa"
  STR_NEWS_3_UFOPEDIA: "* Aktivisté v několika zemích podezírají vlády, že tají náhlý příchod agresivních cizáků; šíří se zvěsti o dřívějších kontaktech.{NEWLINE}* Růst newyorské burzy pokračuje, ceny zlata, stříbra a platiny dnes stouply o 12 %. Akcie velkých bank klesají.{NEWLINE}* Policie v Bengalúru zatkla muže, který prodával vstupenky na údajně ochočeného 'cizáka' drženého ve městě.{NEWLINE}* Malá, ale hlasitá menšina nadále varuje Evropany před cizáckou činností; průzkumy ukazují, že veřejnost se příliš neobává.{NEWLINE}* Veřejnost přijímá zprávy o činnosti cizáků poblíž New Yorku skepticky.{NEWLINE}* Strážci Yellowstonského národního parku prý spatřili malé šedé humanoidy unášející mladé ženy."

  STR_NEWS_4: "Nejnovější zprávy ze světa"
  STR_NEWS_4_UFOPEDIA: "* Čínští představitelé obviněni z prodeje vyspělých zbraní neznámému kupci; hlavní vyšetřovatel Xzung Tzu byl po druhém dni vyšetřování nalezen mrtvý.{NEWLINE}* Německé úřady údajně označují svědectví o podivných světlech vznášejících se poblíž Černého lesa za 'nespolehlivá'.{NEWLINE}* Britské bulvární listy hlásí rekordní prodeje, protože pozorování cizáků obnovila zájem o mimozemské záhady.{NEWLINE}* Nezávislí výzkumníci tvrdí, že zachytili neobvyklé signály směrované na pozemské radarové soustavy.{NEWLINE}* Podle četných svědků skončila vojenská operace v Brazílii těžkými ztrátami.{NEWLINE}* Přeživší cizáckého útoku vyprávějí o miniaturních létajících talířích, které na všechny v okolí střílely zelené ohnivé koule."

  STR_NEWS_5: "Nejnovější zprávy ze světa"
  STR_NEWS_5_UFOPEDIA: "* Nigerijská vláda údajně překazila pašeráckou operaci s falešnými částmi 'cizáckých' těl, což posiluje pochybnosti veřejnosti o hlášených pozorováních.{NEWLINE}* Neznámý objekt byl podle zpráv sestřelen po dlouhém vzdušném souboji s neznámým stíhacím strojem.{NEWLINE}* Pekingské obchody začínají v reakci na množící se pozorování prodávat upomínkové předměty s motivem UFO.{NEWLINE}* V Rusku zemřel vědec; úřady popírají souvislost s možným výzkumem laserových zbraní.{NEWLINE}* U Bostonu havaroval zpravodajský vrtulník; svědci tvrdí, že jej zasáhla 'cizácká' zbraň.{NEWLINE}* Čínskou vojenskou hlídku podle anonymních zdrojů napadly hadovité bytosti. Než je vojáci zahnali, přišli o polovinu mužů. Čínská armáda věc odmítla komentovat."

  STR_NEWS_6: "Nejnovější zprávy ze světa"
  STR_NEWS_6_UFOPEDIA: "* Návštěvníci pláží v Riu de Janeiru tvrdí, že na obzoru spatřili neobvyklá světla; místní policie vše přičítá nadměrné konzumaci alkoholu.{NEWLINE}* Účastníci jedné z největších demonstrací v dějinách Washingtonu požadují mírové rozhovory s našimi 'hvězdnými bratry'; úřady odpověděly, že cizáci neexistují.{NEWLINE}* Pozorování vyspělého vojenského letounu mířícího k 'havarovanému UFO' na indickém venkově vyvolalo dohady o zásahu vlády.{NEWLINE}* Odpůrci UFO jsou nuceni uznat skutečnou přítomnost cizáků na Zemi.{NEWLINE}* Vědci se ptají, zda světové vlády nezatajily snahy navázat s cizáky diplomatické vztahy.{NEWLINE}* Obyvatelé Říma museli být evakuováni před otevřeným cizáckým útokem. Přeživší údajně viděli velké nepřátelské krabovité tvory, kteří do obětí vkládali předměty připomínající vejce."

  STR_NEWS_7: "Nejnovější zprávy ze světa"
  STR_NEWS_7_UFOPEDIA: "* Obyvatelé tvrdí, že nad hlavním náměstím v Lyonu viděli neobvykle tvarovaný letoun.{NEWLINE}* Nepokoje ve Francii přerůstají možnosti místních úřadů.{NEWLINE}* Svědek údajně viděl neoznačené vojenské jednotky zajmout živého nepřátelského cizáka, což vyvolává podezření na zapojení vlády.{NEWLINE}* Výrobci střelných zbraní očekávají rekordní zisky, protože cizácké útoky zvyšují prodej.{NEWLINE}* Obyvatelé Anglie odmítají policejní tvrzení, že kamerová síť nezachytila žádné důkazy cizácké činnosti.{NEWLINE}* Farmáři v Jižní Dakotě prý našli tělo smrtelně zraněného zeleného humanoida. Vládní úředníci odmítají jakékoli zapojení a farmáře obviňují z užívání drog."

  STR_NEWS_8: "Nejnovější zprávy ze světa"
  STR_NEWS_8_UFOPEDIA: "* Fotograf tvrdí, že má důkazy o setkání jihoafrických představitelů s cizáky.{NEWLINE}* Kybernetické útoky na centrální bankovní systém vyvolaly ve Španělsku hromadný výběr vkladů.{NEWLINE}* Cena zlata dosáhla historického maxima.{NEWLINE}* Někteří indičtí vesničané věří, že cizáci byli sesláni na Zemi jako varování před současnou vládní politikou.{NEWLINE}* Neznámé vojenské jednotky údajně bojují s nepřátelskými cizáky u havarovaného UFO na Sibiři.{NEWLINE}* Policie státu Colorado přijala množství vyděšených hlášení od lidí, kteří prý viděli 'létající ledviny' množící se dělením."

  STR_NEWS_9: "Nejnovější zprávy ze světa"
  STR_NEWS_9_UFOPEDIA: "* Výzkumníci nenalezli jasnou souvislost mezi pokračujícími zprávami o 'neobvyklých světlech' po celém světě.{NEWLINE}* Řídící letového provozu na mezinárodním letišti Narita podávají rozporuplná hlášení o neznámých letounech zachycených oblastním pozemním radarem.{NEWLINE}* Za vetřelci zůstávají nepokoje a náboženské běsnění.{NEWLINE}* Obranné agentury po celém světě oprašují plány, o nichž si nikdy nemyslely, že je použijí.{NEWLINE}* Australský parlament svolává poslance na uzavřené jednání; hlavním tématem budou zřejmě cizácké útoky.{NEWLINE}* Španělští hasiči si nevědí rady s nevysvětlitelnými požáry ničícími rozsáhlé lesy. Někteří údajně zahlédli podivné fialové kameny klouzající po okolí a pohlcující další horninu, ale nikdo je neprozkoumal."

  STR_NEWS_10: "Nejnovější zprávy ze světa"
  STR_NEWS_10_UFOPEDIA: "* Záhadné objekty padající na Zemi se dosud nepodařilo určit.{NEWLINE}* Odborníci diskutují o prvních náznacích, že objekty z vesmíru jsou 'cizáckého' původu.{NEWLINE}* S prudkým růstem pozorování se cizáci stávají novým hitem japonských zábavních médií.{NEWLINE}* Podivné objekty zasáhly několik velkých měst a úřady pátrají po jejich původu.{NEWLINE}* V Bombaji propukl skandál poté, co místní média naznačila, že vládní činitel spolupracuje s 'cizáckými vetřelci'.{NEWLINE}* Modrý létající stroj podobný talíři za bílého dne otevřeně napadl ruský vojenský sklad. Odolal mohutné palbě ručních zbraní, než jej vyřadila hlídka stíhaček MiG."

  STR_NEWS_11: "Nejnovější zprávy ze světa"
  STR_NEWS_11_UFOPEDIA: "* Hlavní titulky se soustředí na četné zprávy o 'cizáckých' útocích na města po celém světě.{NEWLINE}* Neobvyklý letoun vznášející se poblíž Káhiry zachytila kamera; odborníci si s jeho původem nevědí rady.{NEWLINE}* Americká opozice obvinila vládní stranu, že poskytuje prostředky k cizáckým útokům po celém světě.{NEWLINE}* Rostoucí počet pozorování cizáků šokuje světovou veřejnost.{NEWLINE}* Prudký nárůst hlášených UFO mate odborníky.{NEWLINE}* Obyvatelé Argentiny se děsí obřích hmyzích tvorů, kteří pronásledují kořist ze vzduchu a na prchající lidi střílejí zelené paprsky čiré zkázy."

  STR_NEWS_12: "Nejnovější zprávy ze světa"
  STR_NEWS_12_UFOPEDIA: "* Skeptici nadále zpochybňují mizení cizáckých těl po údajných vojenských střetech.{NEWLINE}* Krize infrastruktury - města soupeří o omezené zdroje, zatímco nápor na stavební materiál zpomaluje opravy silnic a dalších dopravních sítí.{NEWLINE}* Argentinské ozbrojené síly tvrdí, že při pokusu o únos zabily cizáka; obyvatelé mají dodržovat zákaz nočního vycházení.{NEWLINE}* Brutalita cizáckých útoků na civilní cíle šokuje svět.{NEWLINE}* Rozvojové země z celého světa žádají OSN o pomoc proti cizácké hrozbě.{NEWLINE}* Přeživší nedávného útoku prý viděli krabům podobné robotické tvory, kteří pobíhali kolem a napadali přihlížející sečnými nástroji."

  STR_NEWS_13: "Nejnovější zprávy ze světa"
  STR_NEWS_13_UFOPEDIA: "* Města po celém světě se potýkají s oběťmi a škodami způsobenými pokračujícími cizáckými útoky.{NEWLINE}* Zprávy nadále naznačují, že odpadlická vojenská organizace neznámého původu napadá cizáky na místech po celém světě.{NEWLINE}* Uniklé důkazy naznačují, že několik kanadských provinčních vlád připravuje kvůli cizácké činnosti nouzové plány.{NEWLINE}* Předseda Africké unie žádá zvláštní zasedání kvůli veřejnému pobouření nad cizáckými útoky po celém kontinentu.{NEWLINE}* Nepřátelští cizáci terorizují svět a vlády se zoufale snaží reagovat.{NEWLINE}* Ruskou základnu na Sibiři napadly neznámé dvounohé robotické stroje střílející světelné paprsky, uvádí jediný přeživší."

  STR_NEWS_14: "Nejnovější zprávy ze světa"
  STR_NEWS_14_UFOPEDIA: "* Jednání Rady bezpečnosti OSN v Bernu přerušila střelba: indický delegát a jeho ochranka napadli ruské zástupce. Vyšetřovatelé mají podezření na ovládnutí mysli.{NEWLINE}* Zprávy o cizácích zabitých v Egyptě dávají jen malou naději, že invaze brzy skončí.{NEWLINE}* Cizácké útoky sílí téměř ve všech částech světa a obyvatelé Země se obávají budoucnosti.{NEWLINE}* Tajný nájezd na záhadný komplex údajně spojený s cizáckou invazí na Zemi.{NEWLINE}* Někteří již považují dobytí Země za nevyhnutelné a prosazují mírové podrobení.{NEWLINE}* Německou vojenskou základnu zničily neznámé síly. Podle přeživších zaútočili obrnění 'želví muži' se střelnými zbraněmi."

  STR_NEWS_15: "Nejnovější zprávy ze světa"
  STR_NEWS_15_UFOPEDIA: "* Jednání OSN v New Yorku přerušili demonstranti, kteří vtrhli do budovy a požadovali zásah proti cizáckým vetřelcům.{NEWLINE}* Australští domorodci založili nové náboženské hnutí a modlí se k nově nalezeným cizáckým bohům.{NEWLINE}* Hlavní lodní trasy kolem Afrického rohu narušilo záhadné potopení tří kontejnerových lodí mířících do Evropy. Přeživší námořníci hlásí zásah jakýmsi světelným paprskem.{NEWLINE}* NASA oznámila sestřelení nebo jiné zničení několika civilních meteorologických družic.{NEWLINE}* Světoví vůdci se navzájem obviňují a naznačují možné spojenectví vládních činitelů s cizáky.{NEWLINE}* Mniši z tibetského kláštera hlásí útok malého světelného disku při cestě k horské svatyni. Několik mnichů zasáhlo 'světlo bohů' a zemřeli. Dalajláma nařídil dva týdny smutku."

  STR_NEWS_16: "Nejnovější zprávy ze světa"
  STR_NEWS_16_UFOPEDIA: "* Po celé Francii znějí sirény a vláda kvůli pokračující cizácké 'válce' varuje před cestami, které nejsou nezbytné.{NEWLINE}* Navzdory svědectvím o vojenských střetech se postup cizáckých útoků téměř nedaří zpomalit.{NEWLINE}* Celkový počet obětí cizáckých útoků zůstává neznámý; někteří odborníci jej odhadují na 'tisíce'.{NEWLINE}* Vzestup 'proticizáckých' milicí vyvolává v několika zemích obavy z pádu vlády.{NEWLINE}* Světoví vůdci nevydali společné prohlášení, přestože cizácké nepřátelství na mnoha místech přerůstá v otevřenou válku.{NEWLINE}* Australský moderátor se v přímém přenosu začal modlit k 'bratrům Starspawnovým' a přidalo se celé studio. Všichni skončili na psychiatrickém pozorování. Svědci viděli z místa prchat malé šedé humanoidy."

  STR_NEWS_17: "Nejnovější zprávy ze světa"
  STR_NEWS_17_UFOPEDIA: "* Část obyvatel velkých australských měst prchá do odlehlých oblastí, aby se vyhnula dalším cizáckým útokům.{NEWLINE}* S růstem cizácké 'války' zaujaly jednotky Národní gardy postavení kolem vládních budov po celých Spojených státech.{NEWLINE}* V Berlíně propuklo násilí mezi skupinami, které se neshodnou na skutečném důvodu cizáckých útoků na Německo.{NEWLINE}* Náboženští představitelé z celého Ruska jednají o dopadu příchodu cizáků na věrouku, zatímco veřejnost stále více pochybuje.{NEWLINE}* Nigerijská vláda hlásí ztráty jednotek, které se pokusily zastavit cizácký útok poblíž hlavního města.{NEWLINE}* Několik obřích humanoidů schopných samostatně ničit tanky zahájilo rozsáhlý útok na jihoamerickou základnu a způsobilo těžké ztráty lidí i techniky."

  STR_NEWS_18: "Nejnovější zprávy ze světa"
  STR_NEWS_18_UFOPEDIA: "* Mluvčí čínské vlády popírá cizácké útoky navzdory drtivým důkazům o vpádech do několika měst.{NEWLINE}* Stupňování cizácké činnosti po celém světě vyvolává otázky, co tyto nevyprovokované útoky motivuje.{NEWLINE}* Města po celém světě se potýkají s oběťmi a škodami způsobenými pokračujícími cizáckými útoky.{NEWLINE}* Rodiny unesených hledají odpovědi u vládních představitelů.{NEWLINE}* Ruský prezident ujišťuje občany, že jakákoli cizácká agrese vyvolá nejtvrdší odpověď; průzkumy ukazují malou důvěru v ozbrojené síly.{NEWLINE}* Společné vojenské cvičení u Varšavy skončilo katastrofou. Modří obří roboti neznámého původu údajně zničili techniku za miliardy dolarů."

  STR_NEWS_19: "Nejnovější zprávy ze světa"
  STR_NEWS_19_UFOPEDIA: "* Státní představitelé Mexika vydávají stále zmatenější prohlášení a přibývá vzájemných obvinění.{NEWLINE}* Japonsko zavedlo pravidelné odstávky proudu, protože infrastruktura po cizáckém útoku utrpěla těžké škody.{NEWLINE}* S přerodem cizáckého konfliktu ve 'válku' zaplavují uprchlíci méně zasažené oblasti.{NEWLINE}* Svědci prý viděli lidského vojáka používat v boji proti cizákům schopnosti 'z jiného světa'.{NEWLINE}* Čínské rozhlasové vysílání dnes přerušily zprávy tvrdící, že 'spolupráce s cizáky' je pro lidskou civilizaci nejlepší.{NEWLINE}* S antarktickou stanicí McMurdo bylo kvůli vánici na 72 hodin přerušeno spojení. Přeživší vědci blábolili a modlili se ke 'Starspawnům'. Nyní jsou na psychiatrickém pozorování."

  STR_NEWS_20: "Nejnovější zprávy ze světa"
  STR_NEWS_20_UFOPEDIA: "* S rostoucím strachem hledá mnoho Brazilců odpovědi v náboženství.{NEWLINE}* Národní zdravotní středisko hlásí znepokojivý nárůst sebevražd, zatímco cizácké útoky nepolevují.{NEWLINE}* Neznámé útoky na klíčovou infrastrukturu rozvrátily světové finanční trhy.{NEWLINE}* Kanaďané se opevňují v domovech, protože cizácká krize v Severní Americe dosahuje bodu zlomu.{NEWLINE}* Itálií se šíří panika poté, co cizáci napadli neznámé jednotky poblíž hustě obydlené oblasti.{NEWLINE}* Všechny hlavní televizní sítě a internetové streamovací služby dnes ráno narušil podvržený přenos: 'Jsme Starspawnové. Nastal čas dokončit sklizeň této planety a začlenit ji do naší říše. Podrobte svou mysl naší vůli, jinak budete na místě zabiti.' Vlády po celém světě vyzývají do zbraně."

  STR_NEWS_21: "Nejnovější zprávy ze světa"
  STR_NEWS_21_UFOPEDIA: "* Přerušení diplomatických vztahů se Španělskem posiluje obavy, že cizáci pronikli do státních institucí.{NEWLINE}* Rybářská vesnice na Newfoundlandu byla vyhlášena karanténní oblastí.{NEWLINE}* Veřejnost znepokojují stále častější poruchy infrastruktury a služeb.{NEWLINE}* Velké počty mohutných UFO nad Jižní Amerikou vyvolávají paniku ve velkých městech. Brazilská vláda vyhlásila stanné právo.{NEWLINE}* Mexičtí farmáři prý poblíž vesnice našli ostatky rozřezaných lidí; místní obyvatelstvo propadá panice.{NEWLINE}* Chile - otřesený jediný přeživší domorodého kmene tvrdí, že jeho vesnici napadli démoni s drápy. Chrlili smrtící dech, který všechny proměnil v nemrtvé."

  STR_NEWS_22: "Nejnovější zprávy ze světa"
  STR_NEWS_22_UFOPEDIA: "* Čínský premiér je hlavním podezřelým v korupčním skandálu spojeném s utajováním údajných tajných operací. Demonstranti požadují konec politických čistek a premiérovo uvěznění.{NEWLINE}* Londýn - zásoby zlata burzy COMEX údajně kryjí vydané certifikáty jen v poměru 1 ku 100; cena zlata během několika hodin vzrostla o 300 %.{NEWLINE}* Indie - farmáři našli na polích dosud neznámé agresivní rostliny, které zničily velkou část úrody. Vědci mají podezření na cizácký původ.{NEWLINE}* Průzkumná sonda NASA a ESA úspěšně dosáhla oběžné dráhy Marsu; po zahájení průzkumu povrchu hlásí Houston technické potíže.{NEWLINE} * Obří mohutní rudí tvorové údajně rozdrtili veřejné vlakové depo poblíž Amsterdamu. Přeživší tvrdí, že obři zcela propadli nezvladatelnému běsnění."
#END NEWS

