  STR_MUTON_BERSERKER_UFOPEDIA: "Tento mohutný tvor je zřejmě poddruhem mutona. Většinou se podobá běžné variantě, avšak nadměrně činné žlázy, patrně obdobné nadledvinám, mu neustále zaplavují organismus hormonem, který jej udržuje v trvalém stavu zuřivosti, otupuje jeho smysly a propůjčuje mu pozoruhodnou odolnost vůči bolesti. Jeho inteligence je oproti běžnému mutonovi výrazně snížena, takže zřejmě útočí výhradně zblízka."
  STR_MUTON_BERSERKER_CORPSE: "Mrtvola mutonského berserka"
  STR_MUTON_BERSERKER_AUTOPSY: "Pitva mutonského berserka"
  STR_MUTON_BERSERKER_AUTOPSY_UFOPEDIA: "Naše první zjištění vrhají na tohoto tvora skutečně děsivé světlo. Ve své podstatě jde o mutona; v jeho genetické stavbě jsme odhalili jen drobné změny, které především zvyšují uměle vyvolanou hladinu hormonů a udržují jej prakticky neustále rozzuřeného. Pozměněné vnímání bolesti a mírně ztvrdlá pokožka výrazně snižují poškození způsobené všemi druhy zbraní."

  STR_CYBERMITE: "Kyberbrouček"
  CYBERMITE_ARMOR: "Bojová analýza: Kyberbrouček"
  STR_CYBERMITE_TERRORIST: "Kyberbrouček terorista"
  STR_CYBERMITE_CORPSE: "Trosky kyberbroučka"
  STR_CYBERMITE_UFOPEDIA: "Tento miniaturní robot je automatizovanou teroristickou zbraní a představuje vrchol cizácké robotiky. Jakmile jeho výkonný optický senzor zaznamená cíl, tvor k němu vyrazí a zaútočí. Miniaturizované eleriové jádro je nastaveno tak, aby se po dostatečném poškození vznítilo a vybuchlo, takže zničení tvora je smrtelně nebezpečné pro každého v okolí."
  STR_CYBERMITE_AUTOPSY: "Analýza kyberbroučka"
  STR_CYBERMITE_AUTOPSY_UFOPEDIA: "Nejnápadnějším prvkem tohoto neuvěřitelně složitého robota je jeho zbraň: slitinové žihadlo propojené s miniaturizovanou nádržkou, která byla podle nalezených stop patrně naplněna silným jedem. Energetické jádro je příliš poškozené na to, abychom mu zcela porozuměli, zdá se však být záměrně velmi citlivé na poškození, které pravděpodobně vyvolá jeho výbuch."

  SECTOPOD_ARMOR: "Bojová analýza: Sektopod"

  STR_HOLODRONE: "Holodron"
  HOLODRONE_ARMOR: "Bojová analýza: Holodron"
  STR_HOLODRONE_TERRORIST: "Holodron terorista"
  STR_HOLODRONE_UFOPEDIA: "Holodrony jsou živé, vznášející se dělostřelecké zbraně. Chrání je plazmová bublina, která narušuje plazmové útoky a oheň. Je možné, že byly vyvinuty přímo k boji s nepřáteli vybavenými plazmovými zbraněmi. Mechanismus pracuje při příliš vysoké teplotě a je příliš radioaktivní, než aby jej bylo možné použít v lidské zbroji."
  STR_HOLODRONE_CORPSE: "Mrtvola holodronu"
  STR_HOLODRONE_AUTOPSY: "Pitva holodronu"
  STR_HOLODRONE_AUTOPSY_UFOPEDIA: "Velmi složitý automat poháněný eleriovým jádrem, které je vzhledem k jeho velikosti mohutné. Z jádra vybíhají dvě ramena sloužící k vytváření plazmové bubliny obklopující tvora. Je také zřejmé, že jádro lze přetížit a nahromaděnou dodatečnou energii využít k vytvoření silného laserového paprsku."

  STR_ARMORED_CYBERDISC: "Obrněný kyberdisk"
  ARMORED_CYBERDISC_ARMOR: "Bojová analýza: Obrněný kyberdisk"
  STR_ARMORED_CYBERDISC_TERRORIST: "Obrněný kyberdisk terorista"
  STR_ARMORED_CYBERDISC_UFOPEDIA: "Zdá se, že jde o zdokonalenou verzi kyberdisku, se kterým jsme se již utkali v několika těžkých bojích. Jeho zbraň byla vylepšena a nyní dokáže střílet dávkou."
  STR_ARMORED_CYBERDISC_CORPSE: "Trosky obrněného kyberdisku"
  STR_ARMORED_CYBERDISC_AUTOPSY: "Analýza obrněného kyberdisku"
  STR_ARMORED_CYBERDISC_AUTOPSY_UFOPEDIA: "Pancéřování tohoto kyberdisku bylo výrazně zesíleno, takže je vysoce odolný vůči trhavé munici a velmi odolný vůči běžným zbraním. K jeho zničení doporučujeme lasery."

  STR_ARMORED_SECTOPOD: "Obrněný sektopod"
  ARMORED_SECTOPOD_ARMOR: "Bojová analýza: Obrněný sektopod"
  STR_ARMORED_SECTOPOD_TERRORIST: "Obrněný sektopod terorista"
  STR_ARMORED_SECTOPOD_UFOPEDIA: "Zdokonalená verze sektopoda, se kterým jsme se již setkali. Jeho zbraň nyní dokáže vypálit ničivou dávku a samotný stroj je mnohem obtížnější zničit. Zmizela také jeho zranitelnost laserovými zbraněmi."
  STR_ARMORED_SECTOPOD_CORPSE: "Vrak obrněného sektopoda"
  STR_ARMORED_SECTOPOD_AUTOPSY: "Pitva obrněného sektopoda"
  STR_ARMORED_SECTOPOD_AUTOPSY_UFOPEDIA: "Pancéřování tohoto sektopoda bylo zdokonaleno, aby lépe odolávalo laserovým a omračujícím zbraním i trhavinám. Nyní na bojišti představuje skutečně závažnou hrozbu. Jeho hlavní kanón vychází z upravené těžké plazmy a dokáže vystřelit dávku pěti ran. Největší šanci na zničení tohoto mohutného stroje smrti nabízí boj zblízka nebo útok z boku, protože jeho čelní pancíř je téměř neproniknutelný."

  STR_CHRYSSALID_SPITTER: "Plivající krysklad"
  CHRYSSALID_SPITTER_ARMOR: "Bojová analýza: Plivající krysklad"
  STR_CHRYSSALID_SPITTER_TERRORIST: "Plivající krysklad terorista"
  STR_CHRYSSALID_SPITTER_UFOPEDIA: "Tento tvor připomíná vyvinutějšího krysklada. Zachoval si drápy svých příbuzných, ale navíc dokáže plivat svá vajíčka na značnou vzdálenost. Zdá se, že vajíčka pohání mimořádně silná kyselina, která dokáže naleptat i cizácké slitiny."
  STR_CHRYSSALID_SPITTER_CORPSE: "Mrtvola plivajícího krysklada"
  STR_CHRYSSALID_SPITTER_AUTOPSY: "Pitva plivajícího krysklada"
  STR_CHRYSSALID_SPITTER_AUTOPSY_UFOPEDIA: "Tento podivný tvor je zřejmě nebezpečnější variantou krysklada. Blanitý vak uložený v kloace vytváří kyselou sloučeninu a tlak potřebný k vymrštění vajíček dostatečně vysokou rychlostí, aby pronikla zbrojí. Díky kyselině dokáže tvor nakazit oběti na značnou vzdálenost. Zřejmě byl navržen tak, aby za ještě kratší dobu infikoval velkou část obyvatelstva."

  STR_SPITTER_ZOMBIE: "Zombie plivajícího krysklada"
  STR_SPITTER_ZOMBIE_CORPSE: "Mrtvola zombie plivajícího krysklada"

  STR_CYDONIA_STAGE_1: "Cydonie: smíšená sestava 1"
  STR_CYDONIA_STAGE_2: "Cydonie: smíšená sestava 2"
#END ALIEN RACES

#BEGIN ALIEN RESEARCH
  STR_THE_ALIEN_THREAT: "Cizácká hrozba"
  STR_THE_ALIEN_THREAT_UFOPEDIA: "Jak zaznělo v úvodním briefingu X-Comu, musíme prošetřit veškerou probíhající cizáckou činnost a zjistit její účel. Nevíme, co od nás cizáci chtějí, ale zprávy z civilního, vědeckého i vojenského prostředí rozhodně nenaznačují mírové úmysly.{NEWLINE}Mrzačení dobytka v zemědělských oblastech a kruhy v obilí svědčí o rostoucí cizácké aktivitě. Pokud ji cizáci ještě zesílí, hrozí rozsáhlá panika.{NEWLINE}Z celého světa navíc přicházejí zprávy o únosech lidí a možných pokusech na nich. Jde o mimořádně znepokojivý vývoj, který bez našeho zásahu může vyvolat masovou hysterii a paniku."

  STR_ALIEN_INVASION: "Cizácká invaze"
  STR_ALIEN_INVASION_UFOPEDIA: "Po prozkoumání všech dat ze zajištěné Cizácké datové tabulky a vyhodnocení výslechů zajatců už známe účel příchodu cizáků na Zemi. Jsme přesvědčeni, že cílem příchodu Starspawnů je úplná cizácká invaze.{NEWLINE}Abychom získali další informace o jejich taktice, strategii a technologiích, potřebujeme více znalostí. Vědecká divize doporučuje zajímat a vyslýchat další cizáky, přednostně jedince obeznámené s jejich technikou, výzbrojí a operacemi. Předpokládáme, že větší UFO mají na palubě alespoň jednoho cizáckého vůdce."

  STR_ALIEN_ORIGINS_UFOPEDIA: "Je zřejmé, že na Zemi vedeme prohraný boj. Cizácké hordy mají drtivou početní převahu a my dokážeme jejich postup nanejvýš zpomalit. Jedinou nadějí lidstva je udeřit proti cizákům u samotného zdroje. Náš výzkum naznačuje, že mají operační základnu někde poblíž ve Sluneční soustavě. Podle cizáků je toto místo střediskem prastaré civilizace, která předcházela lidským dějinám. Musíme je co nejdříve najít. K získání podrobností však potřebujeme zajmout a vyslechnout cizáckého velitele. Zdá se, že velitelé se nacházejí pouze v cizáckých základnách."

  STR_THE_MARTIAN_SOLUTION_UFOPEDIA: "Výzkum nyní ukazuje na Mars jako základnu cizáckých operací. Dobře ukrytý komplex obsahuje veškerá výrobní a klonovací zařízení potřebná k infiltraci Země. Zřejmě se v něm nachází také jakýsi řídicí počítač ovládající celou operaci. Cizácká společnost připomínající úl patrně má svou 'včelí královnu'. To je její zásadní slabina: odstraníme-li 'mozek', tělo zemře. Musíme výzkum urychlit, než bude pozdě. K dalšímu postupu musíme zajmout nejvýše postavené cizáky, etheralské velitele, kteří pobývají pouze v základnách rasy Etheralů."

  STR_PLASMA_WEAPONS: "Cizácké plazmové zbraně"
  STR_PLASMA_WEAPONS_UFOPEDIA: "Naše původní teorie o funkci těchto zbraní se potvrdily. Informace získané z Cizáckého datového jádra nám umožní zbraně prozkoumat a konečně pochopit jejich základní principy. Potřebujeme další výzkum a také někoho, kdo dokáže vysvětlit přizpůsobení energetických systémů zbraní zemskému gravitačnímu poli. Plazmové zbraně používané cizáky v boji jsou mimořádně smrtící."

  STR_LAUNCHER_WEAPONS: "Cizácké odpalovací zbraně"
  STR_LAUNCHER_WEAPONS_UFOPEDIA: "Cizáci zřejmě nasazují odpalovací zbraně poměrně podobné našim Ručním raketometům. Další informace o těchto účinných zbraňových systémech musíme získat z výslechů a Cizáckého datového jádra."

  STR_ALIEN_BIOLOGY: "Biologie cizáků"
  STR_ALIEN_BIOLOGY_UFOPEDIA: "Cizácká DNA se v některých ohledech nápadně podobá naší, přesto její struktura naznačuje mimořádné stáří, rozhodně větší než u lidské DNA. Některé úseky byly navíc zřejmě přidány uměle a pravděpodobně pocházejí z pozemských organismů. Domníváme se, že jde o genetické přizpůsobení prostředí. Imunitní systém se zdá poměrně slabý, proto musíme přesně zjistit způsob výživy a rozmnožovací cyklus cizáků, abychom je mohli správně držet k výslechu. Odpovědi by mohla poskytnout větší cizácká zařízení."

  STR_ALIEN_LANGUAGE: "Jazyk cizáků"
  STR_ALIEN_LANGUAGE_UFOPEDIA: "Rozluštění cizáckého jazyka bylo mimořádnou výzvou i pro skupinu našich nejlepších vědců a hackerů. Zdá se, že jde o směs nejméně sedmi původních jazyků, které se během dlouhé doby sloučily. S těmito základními znalostmi můžeme začít zkoumat počítačová zařízení nalezená v UFO. Potřebujeme cizáckého zajatce, který je s těmito přístroji obeznámen a vysvětlí nám jejich základní funkce."

  STR_ALIEN_POWER_SYSTEMS: "Cizácké energetické systémy"
  STR_ALIEN_POWER_SYSTEMS_UFOPEDIA: "Stále je pro nás záhadou, jak cizáci vyrábějí energii z nově objeveného prvku Elerium-115. Domníváme se, že válcovitá zařízení nalezená v UFO jsou jejich zdroje energie a spotřebovávají Elerium-115 jako palivo. K dalšímu postupu potřebujeme živého cizáka, který nám vysvětlí základní funkce těchto zařízení."

  STR_PSIONICS: "Psionika"
  STR_PSIONICS_UFOPEDIA: "Někteří cizáci zřejmě mají psychické schopnosti. Představa, že dokážou u jiného jedince vyvolat trvalý strach nebo zcela ovládnout jeho myšlenkové pochody, je opravdu děsivá. Viděli jsme tyto schopnosti použité proti nám, ale časem možná najdeme způsob, jak je obrátit ve svůj prospěch. K odhalení lidského psionického potenciálu potřebujeme vhodné zařízení; technické a lékařské specifikace by nám mohly poskytnout výslechy zajatců."
#END ALIEN RESEARCH

#BEGIN UFO COMPONENTS
  STR_ALIEN_ALLOYS_UFOPEDIA: "Cizácká plavidla jsou postavena ze zvláštních slitin s jedinečnými vlastnostmi. Jsou mimořádně lehké a odolné a lze je tvarovat elektromagnetickými metodami. Tento materiál nedokážeme vyrábět, ale můžeme jej využít v mnoha výrobních postupech."

  STR_UFO_CONSTRUCTION_UFOPEDIA: "Cizácká plavidla se skládají ze tří hlavních součástí: zdroje energie, navigačního systému a trupu z cizáckých slitin. Trup je zvlášť navržen k usměrňování a ovládání gravitačních vln. Zdroj energie navíc potřebuje malé množství Eleria jako palivo. Jakmile pochopíme konstrukční principy a funkci každé součásti, budeme schopni tato plavidla stavět. Potřebujeme k tomu vyslechnout zajatce s technickými a navigačními znalostmi; při dlouhých kosmických letech můžeme potřebovat také pomoc cizáckých mediků."
#END UFO COMPONENTS

#BEGIN NEW UFOS
  STR_FIGHTER_SHIP: "Stíhač"
  STR_FIGHTER_SHIP_UFOPEDIA: "Stíhače jsou stavěny výhradně k ničení pozemských letounů včetně našich Interceptorů. Na svou velikost jsou mimořádně dobře vyzbrojené a mají stejně početnou posádku jako Střední zvěd."

  STR_SENTRY_SHIP: "Strážní loď"
  STR_SENTRY_SHIP_UFOPEDIA: "Toto malé UFO plní pozorovací a hlídkové úkoly. Je vyzbrojeno pro boj a pro naše Interceptory představuje určitou výzvu. Posádka je stejně početná jako u Velkého zvěda a Exkavátoru."

  STR_EXCAVATOR: "Exkavátor"
  STR_EXCAVATOR_UFOPEDIA: "Exkavátory jsou malá plavidla používaná hlavně k hloubení a stavebním pracím. Pro naše stroje představují jen malou hrozbu. Jejich posádka je stejně početná jako u Strážní lodi a Velkého zvěda."

  STR_LAB_SHIP: "Vědecká loď"
  STR_LAB_SHIP_UFOPEDIA: "Vědecké lodě jsou velká plavidla určená k rozsáhlým výzkumným, únosovým a sklizňovým operacím. Jsou mnohem větší než Kombajny a vybavené k provádění složitých pokusů přímo na palubě. Mají početnou a poměrně dobře vybavenou posádku."
#END NEW UFOS

#BEGIN COMMENDATIONS
  STR_MEDAL_ALIENS_KILLED: "Hvězda za zásluhy"
  STR_MEDAL_ALIENS_KILLED_DESCRIPTION: "Uděluje se vojákovi, který zabil mnoho cizáků."
  STR_MEDAL_ALIENS_KILLED_UFOPEDIA: "\"Nepříteli můžeme ukázat nepřijatelnou cenu jeho boje tím, že:{NEWLINE} vtrhneme na jeho území;{NEWLINE} provedeme operace, které zvýší jeho utrpení;{NEWLINE} nebo nepřítele postupně vyčerpáme.\"{NEWLINE} -- Clausewitz{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákovi, který prokázal svou smrtonosnost a zabil mnoho cizáků.{NEWLINE}{NEWLINE} Nárok na první stupeň vzniká po 10 zabitích. Další stupně se udělují za každých dalších 10 zabití."

  STR_MEDAL_ALIENS_KILLED_BY_INCENDIARY: "Hvězda pekel"
  STR_MEDAL_ALIENS_KILLED_BY_INCENDIARY_DESCRIPTION: "Za zabíjení nepřátel zápalnými zbraněmi."
  STR_MEDAL_ALIENS_KILLED_BY_INCENDIARY_UFOPEDIA: "\"Ze čtyř klasických živlů je oheň zdaleka nejprvotnější. Nejnáročnější. Nejnebezpečnější. Nejmocněji proměňující. Nejpůsobivější na smysly. A nejzábavnější. Vážně: který nepřítel by se zastavil hrůzou, kdybyste před něj předstoupili a prohlásili se za velkého vodního čaroděje?\"{NEWLINE} -- The Rant{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje těm, kdo ovládli umění ničit nepřítele ohněm. Uděluje se za každých pět upálených cizáků, nejvýše čtyřikrát."

  STR_MEDAL_ALIENS_KILLED_BY_RACE: "Medaile za xenocidu mimozemské rasy"
  STR_MEDAL_ALIENS_KILLED_BY_RACE_DESCRIPTION: "Za úspěšné boje s {0}."
  STR_MEDAL_ALIENS_KILLED_BY_RACE_UFOPEDIA: "\"Pokud se ocitnete ve férovém boji, nenaplánovali jste misi správně.\"{NEWLINE} -- David Hackworth{NEWLINE}{NEWLINE} Uděluje se vojákovi, který se stal smrtícím strojem při potírání určité cizácké rasy. Tato rasa rukou hrdiny XCOMu utrpěla takové ztráty, že mu začala říkat Xenocida.{NEWLINE}{NEWLINE} Jednotlivé stupně se udělují za 10, 20 a 30 zabití příslušníků dané rasy."

  STR_MEDAL_ALIENS_KNOCKED_OUT: "Řád omezení svobody"
  STR_MEDAL_ALIENS_KNOCKED_OUT_DESCRIPTION: "Za používání nesmrtících prostředků k vyřazování nepřátel."
  STR_MEDAL_ALIENS_KNOCKED_OUT_UFOPEDIA: "\"Na toho, kdo najde Millennium Falcon, čeká veliká odměna. Můžete použít jakékoliv metody, ale chci je živé. Mrtvoly nepotřebuju.\" -- Darth Vader{NEWLINE}{NEWLINE} Vyznamenání oceňuje vojáka, který ovládl umění zajímat mimozemšťany živé. Živé exempláře mohou být pro pochopení hrozby, jíž čelíme, neobyčejně důležité.{NEWLINE}{NEWLINE} Jednotlivé stupně se udělují za 4, 8, 12 a 16 zajatců."

  STR_MEDAL_ALIEN_BASE_ASSAULT: "Pozemský kříž"
  STR_MEDAL_ALIEN_BASE_ASSAULT_DESCRIPTION: "Za účast v úspěšném útoku na cizáckou základnu."
  STR_MEDAL_ALIEN_BASE_ASSAULT_UFOPEDIA: "\"Vrhni je do záhuby a oni přežijí. Vrhni je v náruč smrti a oni budou žít.\" -- Sun-c'{NEWLINE}{NEWLINE} Každý útok na nepřátelskou základnu je krokem k vítězství. Ničením nepřítele v jeho centrech moci postupujeme ke konečnému vítězství.{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří se zúčastní útoku na cizáckou základnu. Lze je udělit třikrát."

  STR_MEDAL_ALIEN_SOLDIERS_KILLED_ALL_RACES: "Řád kladiva"
  STR_MEDAL_ALIEN_SOLDIERS_KILLED_ALL_RACES_DESCRIPTION: "Za zabití všech možných druhů cizáckých vojáků."
  STR_MEDAL_ALIEN_SOLDIERS_KILLED_ALL_RACES_UFOPEDIA: "\"Neboj se jich, mé dítě. Všechny je zabijeme.\"{NEWLINE} -- Království{NEWLINE}{NEWLINE} Tato medaile oceňuje vojáka, který ovládl umění zabíjet cizáky ve všech podobách. Žádná cizácká rasa není před jeho útoky v bezpečí.{NEWLINE}{NEWLINE} První stupeň se uděluje za zabití vojáka každé z hlavních ras. Další stupně vyžadují 5, 10 a 15 zabitých příslušníků každé rasy."

  STR_MEDAL_ALLBATTLETYPES: "Medaile Armis Potens"
  STR_MEDAL_ALLBATTLETYPES_DESCRIPTION: "Uděluje se vojákovi, který prokázal smrtící účinnost se všemi druhy zbraní."
  STR_MEDAL_ALLBATTLETYPES_UFOPEDIA: "Armis Potens znamená \"mocný ve zbrani\". Pěšák je vycvičen k boji mnoha různými druhy zbraní, aby dokázal porazit nepřítele.{NEWLINE}{NEWLINE} Vyznamenání oceňuje tutéž obratnost a smrtonosnost, jakou prokazují tito všestranní bojovníci.{NEWLINE}{NEWLINE} Uděluje se vojákovi, který zlikviduje nepřítele každým druhem zbraně: střelnou zbraní, zbraní pro boj zblízka, granátem a minou. Čtyři stupně se udělují za 3, 6, 9 a 12 zabití."

  STR_MEDAL_ALLMISSIONS: "Medaile za cestu do pekla a zpět"
  STR_MEDAL_ALLMISSIONS_DESCRIPTION: "Za účast ve všech možných druzích misí."
  STR_MEDAL_ALLMISSIONS_UFOPEDIA: "\"Můžeš jim říct,{NEWLINE} že jsem prošel peklem a vrátil se.{NEWLINE} Když přituhne, palbu opětuji.{NEWLINE} Kde máte v tomhle chladném světě zapalovače?{NEWLINE} Pojďme ho zapálit, p-p-palbu opětovat.\"{NEWLINE} -- Kid Ink{NEWLINE}{NEWLINE} Tento voják už zažil všechno: havarovaná i přistálá UFO, teroristické mise, obranu základny, a dokonce i vykopnutí dveří nepřítele při útoku na jeho základnu.{NEWLINE}{NEWLINE} Vyznamenání se uděluje vojákům, kteří se zúčastní všech druhů misí."

  STR_MEDAL_ALLRANKS: "Seznam poražených"
  STR_MEDAL_ALLRANKS_DESCRIPTION: "Za zabití cizáckých vojáků všech možných hodností."
  STR_MEDAL_ALLRANKS_UFOPEDIA: "\"...tihle houževnatí vietnamští mariňáci začali nakopávat zadky a zapisovat si jména.\"{NEWLINE} -- Ralph Christopher, River Rats{NEWLINE}{NEWLINE} Úsloví o zapisování jmen vychází z představy, že nepřítele porazíte tak drtivě, až z jeho seznamu jednotky začnou mizet jména.{NEWLINE}{NEWLINE} Vyznamenání se uděluje vojákovi, který zabije cizáka každé hodnosti od vojáka po velitele."

  STR_MEDAL_ALLUFOS: "Odznak TECHINT"
  STR_MEDAL_ALLUFOS_DESCRIPTION: "Uděluje se vojákovi, který se zúčastnil misí u všech druhů UFO."
  STR_MEDAL_ALLUFOS_UFOPEDIA: "TECHINT neboli technické zpravodajství získává poznatky o schopnostech nepřítele využitím ukořistěného vybavení.{NEWLINE}{NEWLINE} XCOM získává poznatky a vojenský materiál z každého zajištěného UFO.{NEWLINE}{NEWLINE} Toto jednorázové vyznamenání obdrží vojáci, kteří se zúčastnili misí u všech druhů UFO."

  STR_MEDAL_ANTITERROR: "Herkulova medaile"
  STR_MEDAL_ANTITERROR_DESCRIPTION: "Uděluje se vojákovi za zabití všech druhů cizáckých teroristických jednotek."
  STR_MEDAL_ANTITERROR_UFOPEDIA: "\"Pravým hrdinou se nestaneš, máš-li v těle pouze sílu, ale musíš mít také velké srdce.\"{NEWLINE} -- Zeus (Herkules){NEWLINE}{NEWLINE} Stejně jako Herkules proslul zabitím mnoha děsivých nestvůr, také nositel tohoto vyznamenání porazil svůj díl strašlivých nepřátel.{NEWLINE}{NEWLINE} Medaile se uděluje vojákům, kteří zabijí po jedné jednotce každého teroristického druhu ve hře. Má čtyři stupně."

  STR_MEDAL_BASE_DEFENDER: "Medaile obránce"
  STR_MEDAL_BASE_DEFENDER_DESCRIPTION: "Za účast při úspěšné obraně základny."
  STR_MEDAL_BASE_DEFENDER_UFOPEDIA: "\"Bojiště si vybrat nemůžete, to za vás udělá Bůh; můžete však vztyčit prapor tam, kde dosud žádný nevlál.\"{NEWLINE} -- Nathalia Craneová{NEWLINE}{NEWLINE} Tato medaile se uděluje bojovníkovi, který se zúčastnil úspěšné obrany základny. Přestože se cizácké hordy pokusily tuto statečnou duši přemoci, voják udržel obrannou linii a pomohl XCOMu zachovat kontrolu nad klíčovým zařízením.{NEWLINE}{NEWLINE} Lze ji udělit až za tři úspěšné obrany základny."

  STR_MEDAL_BESTOFRANK: "Padlá hvězda"
  STR_MEDAL_BESTOFRANK_DESCRIPTION: "Uděluje se posmrtně vojákovi, který ve své hodnosti patřil k vycházejícím hvězdám."
  STR_MEDAL_BESTOFRANK_UFOPEDIA: "\"Po smrti je tvůj,{NEWLINE} na drobné hvězdy si ho rozkrájej...\"{NEWLINE} -- Shakespeare, Romeo a Julie{NEWLINE}{NEWLINE} Hrdinové XCOMu si bez ohledu na hodnost zaslouží po smrti uznání za vynikající výkony.{NEWLINE}{NEWLINE} Tento řád se uděluje padlému vojákovi, který měl v okamžiku smrti nejvyšší skóre mezi příslušníky své hodnosti. Na každé úrovni může toto posmrtné uznání získat více vojáků."

  STR_MEDAL_BESTSOLDIER: "Hrdinský řád"
  STR_MEDAL_BESTSOLDIER_DESCRIPTION: "Uděluje se posmrtně vojákovi, který byl příkladem pro všechny ostatní."
  STR_MEDAL_BESTSOLDIER_UFOPEDIA:  "\"Zemřít, to není hrozné; hrozné je nežít!\"{NEWLINE} -- Victor Hugo, Bídníci{NEWLINE}{NEWLINE} Když hrdinové zemřou, jejich činy žijí dál. Na hrdinské skutky vojáků XCOMu se nezapomíná ani po jejich smrti v boji.{NEWLINE}{NEWLINE} Řád se uděluje vojákovi, který má v okamžiku smrti nejvyšší skóre ze všech padlých. Stejné posmrtné uznání může postupně získat více vojáků."

  STR_MEDAL_BRAVERYGAIN: "Legie statečnosti"
  STR_MEDAL_BRAVERYGAIN_DESCRIPTION: "Uděluje se vojákovi, který je příkladem statečnosti."
  STR_MEDAL_BRAVERYGAIN_UFOPEDIA: "\"Poznal jsem, že odvaha není nepřítomnost strachu, ale vítězství nad ním. Statečný není ten, kdo strach necítí, nýbrž ten, kdo jej překoná.\" -- Nelson Mandela{NEWLINE}{NEWLINE} Tento voják prošel vypjatými situacemi a postavil se strachu tváří v tvář.{NEWLINE}{NEWLINE} Vyznamenání se uděluje za každé zvýšení statečnosti vojáka o 10 bodů a má tři stupně."

  STR_MEDAL_DAYS_WOUNDED: "Karmínové srdce"
  STR_MEDAL_DAYS_WOUNDED_DESCRIPTION: "Za zranění, které vojáka vyřadilo na velmi dlouhou dobu."
  STR_MEDAL_DAYS_WOUNDED_UFOPEDIA: "Toto vyznamenání vzdává poctu velké oběti zraněného bojovníka. Jako skutečný \"rudý odznak odvahy\" oceňuje vojáka, který utrpěl těžká zranění.{NEWLINE}{NEWLINE} Uděluje se podle souhrnného počtu dnů strávených v léčení, za každých 30 dnů až do 300."

  STR_MEDAL_DOUBLEKILL: "Medaile za vynikající výkon"
  STR_MEDAL_DOUBLEKILL_DESCRIPTION: "Uděluje se vojákovi, který se na bojišti vyznamenal zabitím více nepřátel v rychlém sledu."
  STR_MEDAL_DOUBLEKILL_UFOPEDIA: "\"Jeden nepřátelský voják nikdy nestačí, ale dva jsou až příliš.\"{NEWLINE} -- Murphyho zákony boje{NEWLINE}{NEWLINE} Tato pochvala oceňuje vojáky, kteří zlikvidují dva cíle v rychlém sledu. Čím rychleji nepřítele odstraníme, tím dříve se vrátíme domů.{NEWLINE}{NEWLINE} Pro tyto pohotové střelce existují čtyři stupně vyznamenání."

  STR_MEDAL_FALLEN: "Řád padlých"
  STR_MEDAL_FALLEN_DESCRIPTION: "Uděluje se vojákovi na počest jeho smrti a oddanosti obraně Země."
  STR_MEDAL_FALLEN_UFOPEDIA: "\"Hrdina je někdo, kdo obětoval život něčemu většímu, než je on sám.\"{NEWLINE} -- Joseph Campbell{NEWLINE}{NEWLINE} Dobrovolně zaplatili nejvyšší cenu, aby lidstvo mohlo přežít. Toto vyznamenání se uděluje posmrtně všem příslušníkům XCOMu, kteří zemřou v boji. Je správné uchovat je v paměti a uctít je svými činy, zatímco pokračujeme ve věci, za niž položili život.{NEWLINE}{NEWLINE} Vyznamenání se uděluje posmrtně všem příslušníkům XCOMu, kteří padnou v boji."

  STR_MEDAL_FLANKSHOT: "Pochvala za boční palbu"
  STR_MEDAL_FLANKSHOT_DESCRIPTION: "Za příkladný taktický pohyb, kterým voják obešel nepřítele a zabil jej z boku."
  STR_MEDAL_FLANKSHOT_UFOPEDIA: "\"Vést boční palbu znamená rozmístit vojáky nebo děla tak, aby mohli ostřelovat bok nepřítele.\"{NEWLINE} -- Vojenský slovník{NEWLINE}{NEWLINE} Útok z boku je osvědčená vojenská taktika. Využívá slabšího bočního pancíře i skutečnosti, že nepřátelské zbraně míří jinam.{NEWLINE}{NEWLINE} Pochvala se uděluje za každá tři zabití nepřítele z boku, nejvýše čtyřikrát."

  STR_MEDAL_GLOBETROTTER: "Světoběžník"
  STR_MEDAL_GLOBETROTTER_DESCRIPTION: "Uděluje se vojákovi, který bránil každou zemi na Zemi před cizáckou hrozbou."
  STR_MEDAL_GLOBETROTTER_UFOPEDIA: "\"Nechoďte tam, kam může vést cesta. Vydejte se raději tam, kde žádná cesta není, a zanechte stopu.\"{NEWLINE} -- Ralph Waldo Emerson{NEWLINE}{NEWLINE} Toto vyznamenání získá voják, který absolvoval misi ve všech zemích světa."

  STR_MEDAL_GRENADIER: "Granátníkova medaile"
  STR_MEDAL_GRENADIER_DESCRIPTION: "Za zabití tří cizáků jedinou vrženou výbušninou."
  STR_MEDAL_GRENADIER_UFOPEDIA: "\"Pětisekundové zápalnice vždy vyhoří za tři sekundy.\"{NEWLINE} -- Murphyho zákony boje{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří dokázali své granáty XCOMu využít naplno. Neoceňuje jen běžnou zdatnost, ale schopnost zabít jediným granátem více nepřátel.{NEWLINE}{NEWLINE} Čtyři stupně se udělují za zabití tří nepřátel najednou standardním ručním granátem nebo minou."

  STR_MEDAL_HEADSHOT: "Davidův řád"
  STR_MEDAL_HEADSHOT_DESCRIPTION: "Uděluje se vojákovi s pevnou rukou, který zaznamenal několik zásahů do hlavy."
  STR_MEDAL_HEADSHOT_UFOPEDIA: "\"Kámen se mu zaryl do čela a on se skácel tváří k zemi.\" -- 1 S 17,49{NEWLINE}David proslul tím, že obra zabil prakem a dobře mířenou ranou.{NEWLINE}{NEWLINE} Přestože tento úspěch závisí především na štěstí a nezpůsobuje větší poškození než jiné zásahy, stojí za pozornost.{NEWLINE}{NEWLINE} Vyznamenání obdrží vojáci XCOMu za tři zásahy do hlavy. Má čtyři stupně."

  STR_MEDAL_HEALER: "Hippokratova hvězda"
  STR_MEDAL_HEALER_DESCRIPTION: "Za provádění zdravotních služeb na bojišti."
  STR_MEDAL_HEALER_UFOPEDIA: "\"Tichého zdravotníka jsme si hluboce vážili. Byl pro nás ošetřovatelem, lékařem, stanicí první pomoci i nemocnicí. Nad hlukem bitvy často znělo volání 'Doktora!' a ten byl třetí četě vždy nablízku.\"{NEWLINE} -- Robert W. Black{NEWLINE}{NEWLINE} Bojový zdravotník je nepostradatelnou součástí každé vojenské jednotky. Vojáci XCOMu se starají o své druhy a pomáhají spolubojovníkům zůstat v boji.{NEWLINE}{NEWLINE} Vyznamenání se uděluje za každé tři ošetřené rány až do celkového počtu dvanácti."

  STR_MEDAL_IMPORTANT_ALIENS_KNOCKED_OUT: "Boltův kříž"
  STR_MEDAL_IMPORTANT_ALIENS_KNOCKED_OUT_DESCRIPTION: "Za použití nesmrtících prostředků k vyřazení důležitých cílů."
  STR_MEDAL_IMPORTANT_ALIENS_KNOCKED_OUT_UFOPEDIA: "Kapitán Steven Hiller: \"Tenhle víkend jsem měl mít volno. Ale to né. Místo toho se teď tady s tebou musím táhnout přes rozpálenou poušť. A to ti ještě koukaj chapadla z mýho padáku.\"{NEWLINE} -- Den nezávislosti{NEWLINE}{NEWLINE} Toto vysoké vyznamenání oceňuje zásadní úspěch při zajetí významného cíle. Nepřátelští vůdci a velitelé nám jistě pomohou lépe pochopit cizácké cíle i způsoby, jak je porazit.{NEWLINE}{NEWLINE} Vyznamenání se jednou uděluje každému vojákovi, který některý z těchto důležitých cílů zajme."

  STR_MEDAL_IRON_MAN: "Železný muž"
  STR_MEDAL_IRON_MAN_DESCRIPTION: "Uděluje se vojákovi, který je skutečným železným mužem či ženou."
  STR_MEDAL_IRON_MAN_UFOPEDIA: "\"Jestliže vám chybí všechno kromě nepřítele, jste v bojové zóně.\"{NEWLINE} -- Murphyho zákony boje{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří se nepříteli postaví sami. Pokusí se o to jen ti nejtvrdší a ještě méně jich přežije. Vyznamenání má jediný stupeň."

  STR_MEDAL_LUCKYSHOT: "Pochvala za šťastný zásah"
  STR_MEDAL_LUCKYSHOT_DESCRIPTION: "Za úmyslné zasažení nepřítele při velmi nepravděpodobné šanci na zásah."
  STR_MEDAL_LUCKYSHOT_UFOPEDIA: "\"Nejlepší ze všeho je štěstí, které si vytvoříte sami.\"{NEWLINE} -- Douglas MacArthur{NEWLINE}{NEWLINE} Když voják opakovaně vzdoruje pravděpodobnosti a zasahuje téměř nemožné cíle, získává nárok na toto vyznamenání.{NEWLINE}{NEWLINE} Pochvala se uděluje za každé tři šťastné zásahy a má čtyři stupně."

  STR_MEDAL_MAN_OF_STEEL: "Muž z oceli"
  STR_MEDAL_MAN_OF_STEEL_DESCRIPTION: "Za několikanásobné zasažení nepřáteli v jedné misi."
  STR_MEDAL_MAN_OF_STEEL_UFOPEDIA: "Artuš: \"Hele, ty blbečku, nemáš už žádné ruce!\"{NEWLINE}Černý rytíř: \"Ale mám.\"{NEWLINE}Artuš: (podrážděně) \"Ne!\"{NEWLINE}Černý rytíř: \"To je povrchové.\"{NEWLINE} -- Monty Python a Svatý grál{NEWLINE}{NEWLINE} Železná odolnost tohoto vojáka, a možná i jeho zbroj, mu umožnila vydržet několik nepřátelských zásahů.{NEWLINE}{NEWLINE} Vyznamenání se uděluje za pět utržených zásahů a má tři stupně."

  STR_MEDAL_MARTYR: "Medaile za obětování se"
  STR_MEDAL_MARTYR_DESCRIPTION: "Uděluje se posmrtně vojákovi, který s sebou vzal do hrobu také nepřítele."
  STR_MEDAL_MARTYR_UFOPEDIA: "\"Nikdo není svobodnější než člověk, který nemá co ztratit.\"{NEWLINE} -- Don Quijote{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje po nejvyšší oběti ve službě za každého nepřítele, kterého voják vezme s sebou do hrobu, až do počtu deseti."

  STR_MEDAL_MEDIKIT: "Polní chirurg"
  STR_MEDAL_MEDIKIT_DESCRIPTION: "Za časté používání lékárničky na bojišti."
  STR_MEDAL_MEDIKIT_UFOPEDIA: "\"...Ale toto zranění bylo čerstvé, hluboko v šestihodinové lhůtě, která u podobných případů slouží polnímu chirurgovi jako hrubé vodítko. Pokud se ve svém tvrzení nemýlil..., mohl zachránit život.\"{NEWLINE} -- Frank Gill Slaughter, Bojový chirurg{NEWLINE}{NEWLINE} Polní chirurg je zkušenější než bojový zdravotník a umí využít všechny nástroje, které má k dispozici.{NEWLINE}{NEWLINE} Vyznamenání se uděluje zdravotníkům, kteří z lékárniček poskytují léčbu, stimulanty i léky proti bolesti. Jeden stupeň náleží za každou trojici těchto použití; celkem má čtyři stupně."

  STR_MEDAL_MELEE: "Medaile za boj zblízka"
  STR_MEDAL_MELEE_DESCRIPTION: "Uděluje se vojákovi za zabíjení cizáků smrtícími zbraněmi pro boj zblízka."
  STR_MEDAL_MELEE_UFOPEDIA: "\"Plyňte v živém okamžiku. Stále se proměňujeme a nic není pevné. Nemějte v sobě žádný strnulý systém a budete se pružně přizpůsobovat neustálým změnám. Otevřete se a plyňte, příteli. Plyňte v naprosté otevřenosti živého okamžiku. Nezůstane-li ve vás nic strnulého, okolní věci se samy odhalí. V pohybu buďte jako voda. V klidu jako zrcadlo. Odpovídejte jako ozvěna.\"{NEWLINE} -- Bruce Lee{NEWLINE}{NEWLINE} Tato medaile se uděluje každému vojákovi, který zbraní pro boj zblízka zabije cizáka. Uděluje se za každá čtyři zabití a má čtyři stupně."

  STR_MEDAL_MERCY_CROSS: "Kříž milosrdenství"
  STR_MEDAL_MERCY_CROSS_DESCRIPTION: "Uděluje se vojákovi, který během mise sám omráčil všechny cizáky."
  STR_MEDAL_MERCY_CROSS_UFOPEDIA: "\"Rovněž je lepší celé vojsko zajmout, než zničit, je lepší vzít do zajetí celou jednotku, oddíl nebo skupinu, než je pobít.\" -- Sun-c'{NEWLINE}{NEWLINE} Cizáčtí zajatci poskytují cenné informace. Co může být lepšího než omráčit celou posádku UFO?{NEWLINE} -- Dokázat to sám!{NEWLINE}{NEWLINE} Uděluje se vojákům, kteří během taktické mise sami zajmou všechny nepřátelské bojovníky. Vyznamenání má tři stupně."

  STR_MEDAL_MIA: "Řád zapomenutých"
  STR_MEDAL_MIA_DESCRIPTION: "Uděluje se vojákovi na památku jeho ztráty a služby při obraně Země."
  STR_MEDAL_MIA_UFOPEDIA: "\"...vzdáváme hold mužům a ženám, kteří se nevrátili z bojiště... nikdy nezapomeneme na oběti, které přinesli... navždy budeme ctít jejich památku.\"{NEWLINE} -- Barack Obama{NEWLINE}{NEWLINE} Krutou nutnost zanechat spolubojovníka na bojišti nelze popřít. XCOM vzdává čest těm, kdo tímto způsobem obětovali vše.{NEWLINE}{NEWLINE} Řád se uděluje vojákům nezvěstným v boji. Ctíme ty, kteří se nevrátili domů."

  STR_MEDAL_MINDCONTROL: "Imperius"
  STR_MEDAL_MINDCONTROL_DESCRIPTION: "Za úspěšné ovládnutí mysli nepřítele."
  STR_MEDAL_MINDCONTROL_UFOPEDIA: "\"... ale kdo nezvítězil nad sebou, má v sobě věčného nepřítele.\"{NEWLINE} -- Bhagavadgíta{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří dokážou ovládnout mysl nepřítele. Za každé tři úspěšné pokusy náleží jeden stupeň; celkem má čtyři stupně."

  STR_MEDAL_NIGHT_TERRORMISSION_COUNT: "Stuha nejdelší noci"
  STR_MEDAL_NIGHT_TERRORMISSION_COUNT_DESCRIPTION: "Za účast na nočních misích proti cizáckému teroru."
  STR_MEDAL_NIGHT_TERRORMISSION_COUNT_UFOPEDIA: "\"Den nočním můrám nezabrání. Noc není ke snům nutná. Není lepší čas než právě teď. Není lepší místo než právě tady.\"{NEWLINE} -- Chase LeBlanc{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří zažili hrůzy teroristických misí v noci. Ve stínech číhají nebezpeční cizáci a neopatrným přichází smrt rychle. Ti, kdo přežijí, prokazují skutečnou statečnost.{NEWLINE}{NEWLINE} Uděluje se za každou noční teroristickou misi, nejvýše za čtyři."

  STR_MEDAL_NIKE_CROSS: "Kříž Niké"
  STR_MEDAL_NIKE_CROSS_DESCRIPTION: "Uděluje se vojákovi, který během mise sám zabil, případně zabil či omráčil, všechny cizáky."
  STR_MEDAL_NIKE_CROSS_UFOPEDIA: "\"Chcete-li být dobrým vojákem, musíte věřit, že stojíte na správné straně; proto nejsou žoldnéři k ničemu. Dobrého bojovníka utvářejí emoce a vědomí, že bojuje za správnou věc.\"{NEWLINE} -- Audie Murphy{NEWLINE}{NEWLINE} Toto vyznamenání oceňuje bezkonkurenční zdatnost na bojišti. Tento bojovník ztělesňuje smrtonosnost a své bojové schopnosti prokázal tím nejhmatatelnějším možným způsobem.{NEWLINE}{NEWLINE} Uděluje se výhradně vojákům, kteří během jediné mise sami zabijí všechny cizáky. Lze je získat až třikrát."

  STR_MEDAL_ONE_MONTH_SERVICE: "Medaile za službu v XCOMu"
  STR_MEDAL_ONE_MONTH_SERVICE_DESCRIPTION: "Uděluje se všem vojákům v prvním měsíci služby jako uznání za boj proti cizácké hrozbě a za členství v síle zachraňující lidstvo. Medaile nemá další dekorace."
  STR_MEDAL_ONE_MONTH_SERVICE_UFOPEDIA: "\"Člověk, který nemá nic, za co by byl ochoten bojovat, nic, na čem by mu záleželo více než na vlastní bezpečnosti, je ubohý tvor bez naděje na svobodu, pokud ji pro něj nevydobudou a neudrží lepší lidé, než je on sám.\"{NEWLINE} -- John Stuart Mill{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje všem vojákům sloužícím v XCOMu jako uznání za boj proti cizácké hrozbě a za členství v síle zachraňující lidstvo. Medaile nemá další dekorace."

  STR_MEDAL_ORIGINAL8_DESCRIPTION: "Uděluje se vojákovi, který stál v první řadě boje proti neznámému nepříteli."
  STR_MEDAL_ORIGINAL8_NAME: "První ve službě"
  STR_MEDAL_ORIGINAL8_UFOPEDIA: "Projekt XCOM je přísně tajný program zahájený Radou proti rozsáhlé celosvětové invazi cizáků poté, co je konvenční armády nedokázaly zastavit.{NEWLINE}{NEWLINE} Požadavky pro přijetí do projektu splnila jen hrstka lidí. Ještě méně jich přežije.{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje původní bojové sestavě vojáků projektu XCOM."

  STR_MEDAL_POSTMORTEM_KILL: "Řád Smrtky"
  STR_MEDAL_POSTMORTEM_KILL_DESCRIPTION: "Uděluje se posmrtně vojákovi, jehož vliv na bojiště přetrval i po smrti."
  STR_MEDAL_POSTMORTEM_KILL_UFOPEDIA: "\"Jsou cesty, po nichž se nedáš, jsou vojska, na něž neudeříš, jsou města, na něž neútočíš, jsou místa, o něž nebojuješ, jsou rozkazy vládce, jež nepřijmeš.\"{NEWLINE} -- Sun-c'{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje posmrtně za každého nepřítele, kterého voják vezme s sebou do hrobu, až do počtu deseti."

  STR_MEDAL_PSIPANIC: "Cruciatus"
  STR_MEDAL_PSIPANIC_DESCRIPTION: "Za zlomení mysli nepřítele."
  STR_MEDAL_PSIPANIC_UFOPEDIA: "\"Mysl je sama sobě místem a sama dokáže učinit z pekla nebe a z nebe peklo.\"{NEWLINE} -- John Milton{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří dokážou psionicky vyvolat v nepříteli paniku. Za každé tři úspěšné pokusy se uděluje tato pochvala, která má několik stupňů."

  STR_MEDAL_REACTIONFIRE: "Pochvala za pohotovost"
  STR_MEDAL_REACTIONFIRE_DESCRIPTION: "Uděluje se vojákovi, který prokázal rychlé reflexy a zabil cizáky dříve, než mohli odpovědět."
  STR_MEDAL_REACTIONFIRE_UFOPEDIA: "\"V bojové situaci si nesmíte nechat mysl zakalit emocemi, jako jsou strach a hněv. Situaci jednoduše přijměte a reagujte, i kdybyste čelili nemožné přesile. Zachovejte chladnou hlavu a budete vždy o krok před útočníky.\"{NEWLINE} -- Aaron B. Powell, Doomsday Diaries{NEWLINE}{NEWLINE} Tato medaile se uděluje vojákům, jejichž bleskové reflexy z nich učinily instinktivní zabijáky. Likvidace cílů během tahu nepřítele snižuje ohrožení celého družstva.{NEWLINE}{NEWLINE} Medaile se uděluje za každá dvě zabití reakční střelbou, nejvýše čtyřikrát."

  STR_MEDAL_REARSHOT: "Paridova pochvala"
  STR_MEDAL_REARSHOT_DESCRIPTION: "Uděluje se vojákovi, který prokázal lstivost, překvapil nepřátele a zabil je zezadu."
  STR_MEDAL_REARSHOT_UFOPEDIA: "Paris se v řecké mytologii proslavil tím, že téměř nezranitelného hrdinu Achilla zasáhl šípem do paty.{NEWLINE}{NEWLINE} Voják XCOMu, který Parida napodobí, může podobné slabiny využít také u svých cizáckých protivníků.{NEWLINE}{NEWLINE} Pochvala se uděluje za každá tři zabití nepřítele zezadu, nejvýše čtyřikrát."

  STR_MEDAL_REVIVE: "Andělský kříž"
  STR_MEDAL_REVIVE_DESCRIPTION: "Uděluje se vojákovi, který přivedl spolubojovníka zpět od prahu smrti."
  STR_MEDAL_REVIVE_UFOPEDIA: "\"'Ne, na mé hlídce nezemřeš,' řekl doktor. Těsně před příletem vrtulníku se mu zastavilo srdce. Doktor jej znovu oživil stlačováním hrudníku a dýcháním z úst do úst. Vrtulník konečně dorazil a naložili jsme ho.\"{NEWLINE} -- Stephen Paul Campos{NEWLINE}{NEWLINE} Když voják leží na bojišti v bezvědomí a krvácí, je tento spolubojovník jeho andělem, který ví, jak jej přivést zpět.{NEWLINE}{NEWLINE} Vyznamenání se uděluje za každé oživení raněného, nejvýše třikrát."

  STR_MEDAL_SAPPER: "Sapérská medaile"
  STR_MEDAL_SAPPER_DESCRIPTION: "Uděluje se vojákovi, který zničí mechanického nepřítele silnou výbušninou."
  STR_MEDAL_SAPPER_UFOPEDIA: "\"U stromů je tank. Převálcuje nás... Pokud ho někdo nezastaví brašnovou náloží.\"{NEWLINE} ... \"Už nás moc nezbývá.\"{NEWLINE} -- \"Já půjdu.\"{NEWLINE} -- Juoksuhaudantie{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří silnou výbušninou zničí kovového nepřítele, například kyberdisk nebo sektopoda. Tyto nesmírně nebezpečné hrdinské činy si zaslouží uznání.{NEWLINE}{NEWLINE} Uděluje se za každé zničení robotického nepřítele silnou výbušninou, nejvýše desetkrát."

  STR_MEDAL_SECTOPOD_KILL: "Pochvala za kovovou hrozbu"
  STR_MEDAL_SECTOPOD_KILL_DESCRIPTION: "Za zničení nejobávanějšího nepřátelského stroje: sektopoda."
  STR_MEDAL_SECTOPOD_KILL_UFOPEDIA: "\"Robot nesmí ublížit lidstvu ani svou nečinností dopustit, aby lidstvu bylo ublíženo.\"{NEWLINE} -- Isaac Asimov, nultý zákon robotiky{NEWLINE}{NEWLINE} Otřesy a skřípění kráčejícího sektopoda nahánějí hrůzu i nejstatečnějším vojákům. Obtížnost zničení této kovové hrozby oceňuje právě tato pochvala.{NEWLINE}{NEWLINE} Uděluje se každému vojákovi, který sektopoda zničí libovolným způsobem. Za nejvýše deset zničených sektopodů lze získat deset stupňů."

  STR_MEDAL_SEVEN_IN_ONE: "Řád slávy"
  STR_MEDAL_SEVEN_IN_ONE_DESCRIPTION: "Uděluje se vojákovi, který měl zásadní podíl na úspěchu mise."
  STR_MEDAL_SEVEN_IN_ONE_UFOPEDIA: "\"Vezmete-li na sebe víc než spravedlivý díl cílů, dostanete víc než spravedlivý díl cílů, které bude třeba splnit.\"{NEWLINE} -- Murphyho zákony boje{NEWLINE}{NEWLINE} Tato pochvala vzdává čest vojákovi, který během jediné mise zabil sedm nepřátel. Tento mimořádný výkon dokládá skutečnou houževnatost smrtícího bojovníka.{NEWLINE}{NEWLINE} Vyznamenání lze udělit třikrát."

  STR_MEDAL_SLAVEKILLS: "Loutkovodič"
  STR_MEDAL_SLAVEKILLS_DESCRIPTION: "Za zneužití jednoho cizáka proti jinému."
  STR_MEDAL_SLAVEKILLS_UFOPEDIA: "\"Být obviněn znamenalo být odsouzen a být odsouzen znamenalo být potrestán; jedno vždy následovalo druhé s neměnnou jistotou.\"{NEWLINE} -- Frederick Douglass{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří dokážou obrátit cizáky proti sobě. Jeden stupeň náleží za každé tři takto dosažené úspěchy; celkem má čtyři stupně."

  STR_MEDAL_SNIPER: "Střelecká pochvala"
  STR_MEDAL_SNIPER_DESCRIPTION: "Uděluje se vojákovi, který zasahuje zamýšlené cíle na velkou vzdálenost."
  STR_MEDAL_SNIPER_UFOPEDIA: "{NEWLINE}\"Kříž zaměřovače klidný,{NEWLINE} spoušť chladná,{NEWLINE}cítím zpětný ráz{NEWLINE} a sleduji jeho pád.{NEWLINE}Mise je splněna,{NEWLINE} beru svou výstroj.{NEWLINE}Pušku vyčistím{NEWLINE} v týlu.\"{NEWLINE} -- Odstřelovač námořní pěchoty{NEWLINE}{NEWLINE} Tato pochvala oceňuje mistrovství v rozdávání smrti na dálku.{NEWLINE}{NEWLINE} Uděluje se za každé tři zásahy na velkou vzdálenost a má čtyři stupně."

  STR_MEDAL_STAR_OF_ASCLEPIUS: "Aeskulapova hvězda"
  STR_MEDAL_STAR_OF_ASCLEPIUS_DESCRIPTION: "Uděluje se vojákovi, který se ocitl pod těžkou nepřátelskou palbou."
  STR_MEDAL_STAR_OF_ASCLEPIUS_UFOPEDIA: "\"Válka je život vynásobený číslem, o jakém nikdo nikdy neslyšel.\"{NEWLINE} -- Sebastian Junger{NEWLINE}{NEWLINE} Tím, že na sebe tento voják strhl soustředěnou nepřátelskou palbu, poskytl hrdinskou pomoc svým spolubojovníkům.{NEWLINE}{NEWLINE} Medaile se uděluje vojákům, kteří se desetkrát stali terčem nepřítele. Má tři stupně."

  STR_MEDAL_STATGAIN: "Athénina pochvala"
  STR_MEDAL_STATGAIN_DESCRIPTION: "Uděluje se vojákovi, který se soustavně zdokonaluje."
  STR_MEDAL_STATGAIN_UFOPEDIA: "\"Athéna ztělesňuje moudrost, válečnictví, civilizaci, sílu, strategii, řemesla a spravedlnost.\"{NEWLINE}{NEWLINE} Vojáci XCOMu trénují na bojišti i mimo ně a ti, kdo zlepšují své schopnosti, ztělesňují athénský ideál.{NEWLINE}{NEWLINE} Pochvala se uděluje vojákům, kteří si zvýší celkové statistiky o 10 bodů. Má deset stupňů a nejvyšší oceňuje zlepšení o 100 bodů."

  STR_MEDAL_TOTAL_FRIENDLY_FIRED: "Černý kříž"
  STR_MEDAL_TOTAL_FRIENDLY_FIRED_DESCRIPTION: "Uděluje se vojákovi, který přežil zásah přátelskou palbou."
  STR_MEDAL_TOTAL_FRIENDLY_FIRED_UFOPEDIA: "\"Kulky nerozlišují. Jsou to střely pro každého bez rozdílu.\"{NEWLINE} -- Peter Duysings{NEWLINE}{NEWLINE} Medaile, známá také jako 'Měl ses skrčit, Carle!', se uděluje vojákům zasaženým přátelskou palbou. Jak praví Murphy: 'Přátelská palba není přátelská.'{NEWLINE}{NEWLINE} Toto vyznamenání lze udělit až čtyřikrát."

  STR_MEDAL_TOTAL_IMPORTANT_MISSIONS: "Řád Země"
  STR_MEDAL_TOTAL_IMPORTANT_MISSIONS_DESCRIPTION: "Uděluje se vojákovi, který sehrál zásadní úlohu při obraně Země."
  STR_MEDAL_TOTAL_IMPORTANT_MISSIONS_UFOPEDIA: "\"Ti, kdo rozjímají nad krásou Země, nacházejí zásoby síly, které přetrvají po celý život.\"{NEWLINE} -- Rachel Carsonová{NEWLINE}{NEWLINE} Účastí na důležitých misích sehrál tento voják zásadní roli v obraně naší planety a brzdil cizáckou činnost.{NEWLINE}{NEWLINE} Medaile se uděluje za mise, které nezahrnují nepřátelské Malé ani Střední zvědy, a to po 3, 5, 10, 15, 20, 25, 30, 35, 40 a 50 misích."

  STR_MEDAL_TOTAL_KNOCKED_OUT: "Medaile za odvahu"
  STR_MEDAL_TOTAL_KNOCKED_OUT_DESCRIPTION: "Uděluje se vojákovi, který bojoval do posledního zbytku sil."
  STR_MEDAL_TOTAL_KNOCKED_OUT_UFOPEDIA: "\"Jen člověk, který poznal porážku, dokáže sáhnout až na dno duše a nalézt poslední zbytek síly potřebný k vítězství ve vyrovnaném zápase.\"{NEWLINE} -- Muhammad Ali{NEWLINE}{NEWLINE} Tato medaile se uděluje vojákovi, který bojoval do posledního zbytku sil. Získá ji voják, který na bojišti upadl do bezvědomí, ale přežil.{NEWLINE}{NEWLINE} Uděluje se za každé dva případy ztráty vědomí až do osmi, tedy ve čtyřech stupních."

  STR_MEDAL_TOTAL_LONE_SURVIVOR: "Hvězda statečnosti"
  STR_MEDAL_TOTAL_LONE_SURVIVOR_DESCRIPTION: "Uděluje se vojákovi, který jako jediný přežil misi."
  STR_MEDAL_TOTAL_LONE_SURVIVOR_UFOPEDIA: "\"Nikdy se nevzdám. Má země ode mě očekává větší fyzickou odolnost a duševní sílu, než mají mí nepřátelé. Srazí-li mě k zemi, pokaždé znovu vstanu. Využiji poslední zbytek sil, abych ochránil své druhy a splnil naši misi. Nikdy nejsem vyřazen z boje.\"{NEWLINE} -- Marcus Luttrell{NEWLINE}{NEWLINE} Když bylo družstvo téměř vyhlazeno, tento voják zachoval chladnou hlavu a dokázal zachránit výsadkový letoun.{NEWLINE}{NEWLINE} Jediný přeživší z kterékoliv mise obdrží tuto medaili pouze jednou."

  STR_MEDAL_TOTAL_MISSION_COUNT: "Vojenský kříž"
  STR_MEDAL_TOTAL_MISSION_COUNT_DESCRIPTION: "Uděluje se vojákovi, který se zúčastnil mnoha misí."
  STR_MEDAL_TOTAL_MISSION_COUNT_UFOPEDIA: "\"Stálost, vytrvalost a houževnatost navzdory všem překážkám, zklamáním a zdánlivě nemožnému: právě tím se silná duše ve všem liší od slabé.\"{NEWLINE} -- Thomas Carlyle{NEWLINE}{NEWLINE} Toto vyznamenání se uděluje vojákům, kteří se zúčastnili mnoha misí. Díky své spolehlivosti a houževnatosti se stali důvěryhodnými veterány jednotky.{NEWLINE}{NEWLINE} Uděluje se při 4, 8, 12, 16, 20, 25, 30, 35, 40 a 50 misích."

  STR_MEDAL_TOTAL_MISSION_REGION_COUNT: "Stuha za tažení"
  STR_MEDAL_TOTAL_MISSION_REGION_COUNT_DESCRIPTION: "Uděluje se vojákovi, který úspěšně bránil mnoho oblastí."
  STR_MEDAL_TOTAL_MISSION_REGION_COUNT_UFOPEDIA: "\"Musíme poděkovat všem svým vojákům, a zvláště těm, jimž nikdy nedokážeme vyjádřit dostatek vděku..., neboť položili životy, abychom my všichni mohli být svobodní.\"{NEWLINE} -- Virgil Goode{NEWLINE}{NEWLINE} Země dané oblasti oceňují dovednost a statečnost, s nimiž tento voják ve válce proti cizácké hrozbě chránil jejich životy a majetek.{NEWLINE}{NEWLINE} Medaile se uděluje za 10, 20 a 30 misí v dané oblasti."

  STR_MEDAL_TOTAL_MONTH_SERVICE: "Medaile za dlouhou službu"
  STR_MEDAL_TOTAL_MONTH_SERVICE_DESCRIPTION: "Uděluje se vojákovi, který sloužil mnoho měsíců."
  STR_MEDAL_TOTAL_MONTH_SERVICE_UFOPEDIA: "Toto vyznamenání se uděluje vojákům, kteří v XCOMu sloužili po dlouhou dobu. Oceňuje velké oběti těchto statečných lidí, kteří ve službě vytrvali. Viděli přátele přicházet i odcházet a boje XCOMu proti nepříteli je zocelily. Díky své spolehlivosti a houževnatosti se stali důvěryhodnými veterány jednotky.{NEWLINE}{NEWLINE} Vyznamenání se uděluje za každé tři měsíce služby."

  STR_MEDAL_TOTAL_NIGHT_MISSIONS: "Noční lovec"
  STR_MEDAL_TOTAL_NIGHT_MISSIONS_DESCRIPTION: "Uděluje se vojákovi, který se zúčastnil několika nočních misí."
  STR_MEDAL_TOTAL_NIGHT_MISSIONS_UFOPEDIA: "\"Z noci, jež mě halí,{NEWLINE} černá jak jáma od pólu k pólu,{NEWLINE} děkuji všem bohům, kteří mohou být,{NEWLINE} za svou nepokořenou duši.\"{NEWLINE} -- Invictus, William Ernest Henley{NEWLINE}{NEWLINE} Noční operace proti nepříteli, který vidí téměř dvakrát dále než naši vojáci, jsou krajně nebezpečné.{NEWLINE}{NEWLINE} Vyznamenání se uděluje vojákům účastnícím se nočních misí. Za každé tři noční operace náleží jeden stupeň."

  STR_MEDAL_TRAP: "Kříž záškodníka"
  STR_MEDAL_TRAP_DESCRIPTION: "Uděluje se vojákovi za využívání partyzánské taktiky."
  STR_MEDAL_TRAP_UFOPEDIA: "\"Haló? Je někdo doma?{NEWLINE} Haló, pane Sysel!{NEWLINE} Jo, to jsem já, pan Veverka.{NEWLINE} Jo, já, úplně neškodná veverka.{NEWLINE} Žádná plastická trhavina, nic takovýho.{NEWLINE} Nemáte se vůbec čeho bát.\"{NEWLINE} -- Caddyshack{NEWLINE}{NEWLINE} Tato medaile oceňuje mistrovství v zabíjení nepřítele nástrahami a improvizovanými výbušnými zařízeními. Má čtyři stupně za 1, 3, 5 a 8 zabití minami."

  STR_MEDAL_VALIANT_CRUX: "Kříž chrabrosti"
  STR_MEDAL_VALIANT_CRUX_DESCRIPTION: "Uděluje se vojákovi, který během teroristické mise ochránil všechny civilisty."
  STR_MEDAL_VALIANT_CRUX_UFOPEDIA: "\"Pravý voják nebojuje proto, že nenávidí to, co je před ním, ale proto, že miluje to, co je za ním.\"{NEWLINE} -- G. K. Chesterton{NEWLINE}{NEWLINE} Když udeří teror, jen nepatrná hrstka lidí dokáže odpovědět tak drtivě, že všichni nevinní civilisté uniknou hněvu nadpozemské hrozby.{NEWLINE}{NEWLINE} Vyznamenání obdrží každý voják, který se zúčastní teroristické mise, při níž jsou zachráněni všichni civilisté. Má čtyři stupně."

  STR_MEDAL_WEAPON_PROFICIENCY: "Medaile za mistrovství se zbraní"
  STR_MEDAL_WEAPON_PROFICIENCY_DESCRIPTION: "Uděluje se vojákovi za vynikající výsledky s touto zbraní: {0}."
  STR_MEDAL_WEAPON_PROFICIENCY_UFOPEDIA: "\"Na co stojí za to vystřelit, na to stojí za to vystřelit dvakrát. Munice je levná. Život je drahý.\"{NEWLINE} -- Pravidla amerických rangerů pro přestřelku{NEWLINE}{NEWLINE} Tato medaile oceňuje mimořádné mistrovství vojáka s určitou zbraní. Stal se skutečným odborníkem ve svém oboru a mistrem svého řemesla.{NEWLINE}{NEWLINE} Medaile se uděluje za 10, 20 a 30 zabití určitou zbraní."

  STR_MEDAL_WOUNDED: "Purpurové srdce"
  STR_MEDAL_WOUNDED_DESCRIPTION: "Uděluje se vojákovi, který byl zraněn na bojišti."
  STR_MEDAL_WOUNDED_UFOPEDIA: "Zranění utržená na bojišti jsou hmatatelným důkazem ochoty vojáků XCOMu vystavit se nebezpečí. Tuto oběť oceňuje místní podoba klasického vyznamenání pro raněné.{NEWLINE}{NEWLINE} Medaile se jednou uděluje vojákům, kteří byli zraněni na bojišti."
#END COMMENDATIONS

