  STR_GRAV_SHIELD_UFOPEDIA: "Gravitační štít odpuzuje cizácké stroje pokoušející se přistát u základny tak dlouho, aby mohly všechny obranné systémy vystřelit podruhé. V praxi zdvojnásobí účinnost obrany základny. K výstavbě potřebujeme cizácké materiály.{NEWLINE}{NEWLINE}Potřebné cizácké stavební materiály:{NEWLINE} * CIZÁCKÉ SLITINY: 100{NEWLINE} * ELERIUM-115: 50{NEWLINE} * ZDROJ ENERGIE UFO: 4"
