  STR_PLASMA_DEFENSES_UFOPEDIA: "Obrana plazmovým paprskem poskytuje silnou a účinnou ochranu před útokem nepřátelských strojů. K výstavbě potřebujeme cizácké materiály.{NEWLINE}{NEWLINE}Potřebné cizácké stavební materiály:{NEWLINE} * CIZÁCKÉ SLITINY: 40{NEWLINE} * ELERIUM-115: 20{NEWLINE} * ZDROJ ENERGIE UFO: 1"
