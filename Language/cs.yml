  STR_TERROR_MISSION_INDUSTRIAL: "TERORISTICKÁ MISE: PRŮMYSLOVÁ ZÓNA"
  STR_TERROR_MISSION_INDUSTRIAL_BRIEFING: "Cizáci zahájili útok na průmyslovou městskou oblast. Výrobní zařízení i civilní obyvatelstvo jsou v ohrožení. Náš oddíl musí zlikvidovat všechny cizáky a ochránit nevinné přihlížející před tímto vpádem. Chcete-li misi ukončit, přesuňte příslušníky X-Comu do transportního stroje a klikněte na ikonu 'Zrušit misi'."

  STR_TERROR_MISSION_PORT: "PROTITERORISTICKÁ MISE PŘÍSTAV"
  STR_TERROR_MISSION_PORT_BRIEFING: "Cizáci zahájili útok na pobřežní oblast. Přístav i civilní obyvatelstvo jsou v ohrožení. Váš oddíl musí zlikvidovat všechny cizáky a ochránit nevinné přihlížející před tímto vpádem. Chcete-li misi ukončit, přesuňte příslušníky X-Comu do transportního stroje a klikněte na ikonu 'Zrušit misi'."

  STR_TERROR_MISSION_DOCKED_SHIP: "TERORISTICKÁ MISE: ZAKOTVENÁ LOĎ"

  STR_TERROR_MISSION_TROPICAL: "TERORISTICKÁ MISE: TROPY"

  STR_TERROR_MISSION_ISLAND: "PROTITERORISTICKÁ MISE OSTROV"
  STR_TERROR_MISSION_ISLAND_BRIEFING: "Cizáci zahájili útok na povrchovou lokalitu. Ostrov i jeho civilní obyvatelstvo jsou v ohrožení. Váš oddíl musí zlikvidovat všechny cizáky a ochránit nevinné přihlížející před tímto vpádem. Chcete-li misi ukončit, přesuňte příslušníky X-Comu do transportního stroje a klikněte na ikonu 'Zrušit misi'."

  STR_TERROR_MISSION_MILITARY_BASE: "TERORISTICKÁ MISE: VOJENSKÁ ZÁKLADNA"
  STR_TERROR_MISSION_MILITARY_BASE_ALERT: "CIZÁCI ÚTOČÍ{NEWLINE} NA VOJENSKOU ZÁKLADNU V"
  STR_TERROR_MISSION_MILITARY_BASE_BRIEFING: "Cizáci zahájili útok na vojenskou základnu. Základna i její personál jsou v ohrožení. Váš oddíl musí zlikvidovat všechny cizáky, podpořit vojenské jednotky, které již bojují, a ochránit nevinné přihlížející před tímto vpádem. Chcete-li misi ukončit, přesuňte příslušníky X-Comu do transportního stroje a klikněte na ikonu 'Zrušit misi'."

  STR_TERROR_MISSION_SHIP: "PROTITERORISTICKÁ MISE LOĎ"
  STR_TERROR_MISSION_SHIP_ALERT: "CIZÁCI ÚTOČÍ{NEWLINE} NA CIVILNÍ LOĎ NA MOŘI"
  STR_TERROR_MISSION_SHIP_BRIEFING: "Cizáci unesli civilní loď, která nyní plnou rychlostí míří k hustě osídlené oblasti. Musíte zničit navigační systémy na můstku, loď tím vyřadit z provozu a zabránit možné katastrofě. Chcete-li misi ukončit, přesuňte příslušníky X-Comu do transportního stroje nebo výstupní oblasti a klikněte na ikonu 'Zrušit misi'."
  STR_TERROR_MISSION_SHIP_DISABLED: "LOĎ VYŘAZENA Z PROVOZU"
  STR_TERROR_MISSION_SHIP_OPERATIONAL: "LOĎ JE STÁLE V PROVOZU"
  STR_TERROR_MISSION_SHIP_NAVIGATION_DESTROYED: "NAVIGAČNÍ SYSTÉM ZNIČEN"

  STR_TERROR_MISSION_POLAR: "TERORISTICKÁ MISE: POLÁRNÍ STANICE"
  STR_TERROR_MISSION_POLAR_BRIEFING: "Cizáci zahájili útok na antarktickou výzkumnou stanici. Stanice i její civilní personál jsou v ohrožení. Váš oddíl musí zlikvidovat všechny cizáky a ochránit nevinné přihlížející před tímto vpádem. Chcete-li misi ukončit, přesuňte příslušníky X-Comu do transportního stroje a klikněte na ikonu 'Zrušit misi'."
