  STR_MUTON_ELITE_GUARD_AUTOPSY: "Pitva příslušníka elitní mutonské stráže"
  STR_MUTON_ELITE_GUARD_AUTOPSY_UFOPEDIA: "Tělo tohoto tvora nese mnoho jizev z bitev a řadu dalších kybernetických implantátů. V krevním oběhu jsme také nalezli stopy zvláštní drogy, která zřejmě vyvolává naprostou poslušnost. Další testy prokázaly, že při poklesu její hladiny pod určitou mez začíná selhávat několik základních tělesných funkcí. Vnější vrstva připomíná spíše bojový oblek než kůži: je vysoce odolná vůči laserům, plazmě a trhavému poškození a lze ji srovnat s našimi energetickými skafandry."

