  STR_REINFORCED_FLYING_SUIT_UFOPEDIA: "Vylepšená verze dřívějšího Létajícího skafandru má výrazně vyšší ochranu. Zdokonalené servomotory převzaté ze zesíleného Energetického skafandru zvyšují rychlost pohybu nositele a nový zaměřovací systém zlepšuje reakční střelbu. Odolnost proti plazmovým zbraním se rovněž zvýšila. Jde o nejlepší zbroj, jakou mohou naše jednotky získat."
#END ARMORS

#BEGIN WEAPONS
  STR_COMBAT_KNIFE: "Vojenský nůž"
  STR_COMBAT_KNIFE_UFOPEDIA: "Vycvičený příslušník dokáže tvrzeným ostřím a hrotem tohoto nože jediným seknutím nebo bodnutím tiše zabít lehce obrněného nepřítele.{NEWLINE}Hodí se pro boj zblízka všeho druhu.{NEWLINE}Hodnota síly uživatele se v plné výši přičítá ke způsobenému poškození."

  STR_ALLOY_KNIFE: "Slitinový nůž"
  STR_ALLOY_KNIFE_UFOPEDIA: "Tento vojenský nůž je vyroben z cizáckých slitin, které umožňují vytvořit ostří ostřejší než z jakéhokoli jiného materiálu, který máme k dispozici.{NEWLINE}Hodnota síly uživatele se v plné výši přičítá ke způsobenému poškození."

  STR_ALLOY_SWORD: "Slitinový meč"
  STR_ALLOY_SWORD_UFOPEDIA: "Tento zvlášť zhotovený meč je obávanou zbraní pro boj zblízka. Využívá sílu a dovednost vojáka, takže dokáže porazit i těžce obrněné protivníky.{NEWLINE}Hodnota síly uživatele se v plné výši přičítá ke způsobenému poškození."

  STR_PISTOL_AA_CLIP: "Slitinový zásobník pistole"
  STR_PISTOL_AA_CLIP_X3: "Slitinový zásobník pistole [x3]"
  STR_RIFLE_AA_CLIP: "Slitinový zásobník pušky"
  STR_RIFLE_AA_CLIP_X2: "Slitinový zásobník pušky [x2]"

  STR_TASER_PISTOL: "Taser"
  STR_TASER_PISTOL_CLIP: "Zásobník taseru"
  STR_TASER_PISTOL_UFOPEDIA: "Nesmrtící zbraň odvozená od nejnovější policejní konstrukce dokáže vyřadit cíl až na vzdálenost 15 metrů. Její výboj je slabší než úder tupou omračující zbraní, ale pistolová rukojeť zajišťuje snadnou obsluhu a samotný dosah z ní činí cennou výbavu."
  STR_TASER_PISTOL_ELERIUM_CLIP: "Eleriový zásobník taseru"
  STR_TASER_PISTOL_ELERIUM_CLIP_X2: "Eleriový zásobník taseru [x2]"
  STR_TASER_PISTOL_ELERIUM_CLIP_UFOPEDIA: "Tyto energetické články pro nesmrtící policejní zbraň umožňují vyřadit cíl až na vzdálenost 15 metrů. Napájení pomocí Eleria-115 poskytuje mnohem silnější omračující účinek než naše dřívější čistě pozemské konstrukce."

  STR_SHOTGUN: "Brokovnice"
  STR_SHOTGUN_CLIP: "Náboje do brokovnice"
  STR_SHOTGUN_AA_CLIP: "Slitinové náboje do brokovnice"
  STR_SHOTGUN_AA_CLIP_X2: "Slitinové náboje do brokovnice [x2]"
  STR_SHOTGUN_UFOPEDIA: "Standardní taktická brokovnice X-Com používá broky ráže 12, které na krátkou vzdálenost způsobují těžké poškození nechráněným cílům. Nízká průraznost a rozptyl střel však omezují její účinnost proti odolnějším protivníkům a na větší vzdálenost."

  STR_SNIPER_RIFLE: "Odstřelovací puška"
  STR_SNIPER_RIFLE_CLIP: "Zásobník odstřelovací pušky"
  STR_SNIPER_RIFLE_AA_CLIP: "Slitinový zásobník odstřelovací pušky"
  STR_SNIPER_RIFLE_UFOPEDIA: "Tato odstřelovací puška ráže 12,7 mm je výkonnější než standardní puška a má vynikající přesnost. Je však náročnější na obsluhu a střílí pomalu."

  STR_HC_AA_AMMO: "HC-AP slitinová munice"
  STR_HC_AA_AMMO_UFOPEDIA: "Tento zásobník do Těžkého kanónu využívá cizácké slitiny, které zvyšují výkon a zlepšují průraznost proti obrněným jednotkám."
  STR_HC_EHE_AMMO: "HC-EHE vylepšená výbušná munice"
  STR_HC_EHE_AMMO_UFOPEDIA: "Tento zásobník do Těžkého kanónu spojuje cizácké slitiny s Eleriem-115 do ničivého výbušného náboje s plošným účinkem. V uzavřených prostorách si dejte pozor na okruh výbuchu. Munice je smrtící proti většině cílů a mění Těžký kanón v malý vícenásobný raketomet."

  STR_AC_AA_AMMO: "AC-AP slitinová munice"
  STR_AC_AA_AMMO_UFOPEDIA: "Tento zásobník do Gatlingu využívá cizácké slitiny, které zvyšují výkon a zlepšují průraznost proti obrněným jednotkám."
  STR_AC_EHE_AMMO: "AC-EHE vylepšená výbušná munice"
  STR_AC_EHE_AMMO_UFOPEDIA: "Tento zásobník do Gatlingu spojuje cizácké slitiny s Eleriem-115 do ničivého výbušného náboje s plošným účinkem. Výborně se hodí k likvidaci lehce obrněných nepřátel. Při použití v uzavřených prostorách si dejte pozor na okruh výbuchu."

  STR_GRENADE_LAUNCHER: "Granátomet"
  STR_GRENADE_LAUNCHER_HE_AMMO: "40mm granát (VÝBUŠNÝ)"
  STR_GRENADE_LAUNCHER_IC_AMMO: "40mm granát (ZÁPALNÝ)"
  STR_GRENADE_LAUNCHER_SMOKE_AMMO: "40mm granát (KOUŘOVÝ)"
  STR_GRENADE_LAUNCHER_UFOPEDIA: "Do granátometu M-79 je k dispozici vícero druhů munice, což z něj činí univerzálnější zbraň."

  STR_ELERIUM_ROCKET: "Eleriová raketa"
  STR_ELERIUM_ROCKET_UFOPEDIA: "Podařilo se nám spojit hlavici s Eleriem-115 s upraveným tělem velké rakety, takže ji lze používat v našem standardním Ručním raketometu. Vyšší explozivní síla této zbraně by měla být na bojišti ničivá."

  STR_SCATTER_LASER: "Rozptylový laser"
  STR_SCATTER_LASER_UFOPEDIA: "Rozptylový laser využívá vlastnosti cizáckých slitin a vytváří svazek paprsků podobný rozptylu běžné brokovnice. Je proto účinný v boji zblízka a má vysoký zastavovací účinek. Zbraň nabízí také režim dvojitého výstřelu na krátkou vzdálenost, který přežije jen málokterý nepřítel."

  STR_HEAVY_LASER: "Těžký laser/odstřelovací"
  STR_HEAVY_LASER_UFOPEDIA: "Těžký laser/odstřelovací je neskladný, ale mimořádně účinný. Byl vybaven odstřelovacím zaměřovačem a výborně se hodí k likvidaci cizáků na dálku. Za vyšší palebnou sílu platí absencí automatické střelby."
  STR_HEAVY_LASER_AUTO: "Těžký laser/automatický"
  STR_HEAVY_LASER_AUTO_UFOPEDIA: "Těžký laser/automatický je mimořádně účinný na střední vzdálenost, když je potřeba vysoký zastavovací účinek. Vojáci proklínají obtížné míření, protože zbraň nemá mířený výstřel. Vynahrazuje to rychlou automatickou dávkou čtyř silných laserových paprsků, které proříznou téměř cokoli."

  STR_FIELD_MEDI_PACK: "Polní zdravotnická brašna"
  STR_FIELD_MEDI_PACK_UFOPEDIA: "Polní zdravotnická brašna kombinuje léčebné prostředky s analgetiky a stimulanty. Chcete-li ji použít, musíte stát čelem k ošetřovanému vojákovi. Je-li voják omráčen, musíte stát nad jeho tělem. Klikněte na ikonu brašny a v nabídce zvolte 'Použít Medkit'.{NEWLINE}UZDRAVIT> Červené části těla označují smrtelná zranění. Klikněte na zraněnou část a potom na tlačítko 'UZDRAVIT'. Vyléčí se jedno smrtelné zranění a obnoví 1 bod zdraví.{NEWLINE}STIMULOVAT> Obnoví 5 bodů energie a může probrat omráčeného vojáka z bezvědomí. Musíte stát přímo nad jeho tělem.{NEWLINE}UTIŠIT> Obnoví morálku zraněného vojáka nejvýše o hodnotu odpovídající ztracenému zdraví.{NEWLINE}MAX. POUŽITÍ> LÉČENÍ: 3 | STIMULANT: 3 | UTIŠENÍ: 3"

  STR_MEDI_KIT_UFOPEDIA: "Medkit kombinuje léčebné prostředky s analgetiky a stimulanty. Chcete-li jej použít, musíte stát čelem k ošetřovanému vojákovi. Je-li voják omráčen, musíte stát nad jeho tělem. Klikněte na ikonu medkitu a v nabídce zvolte 'Použít Medkit'.{NEWLINE}UZDRAVIT> Červené části těla označují smrtelná zranění. Klikněte na zraněnou část a potom na tlačítko 'UZDRAVIT'. Vyléčí se jedno smrtelné zranění a obnoví 3 body zdraví.{NEWLINE}STIMULOVAT> Obnoví 10 bodů energie a může probrat omráčeného vojáka z bezvědomí. Musíte stát přímo nad jeho tělem.{NEWLINE}UTIŠIT> Obnoví morálku zraněného vojáka nejvýše o hodnotu odpovídající ztracenému zdraví.{NEWLINE}MAX. POUŽITÍ> LÉČENÍ: 6 | STIMULANT: 6 | UTIŠENÍ: 6"
  STR_UPGRADE_MEDI_KIT_TO_ADVANCED_MEDI_KIT: "Medkit -> Pokročilý medkit"

  STR_ADVANCED_MEDI_KIT: "Pokročilý medkit"
  STR_ADVANCED_MEDI_KIT_UFOPEDIA: "Pokročilý medkit kombinuje léčebné prostředky s analgetiky a stimulanty. Chcete-li jej použít, musíte stát čelem k ošetřovanému vojákovi. Je-li voják omráčen, musíte stát nad jeho tělem. Klikněte na ikonu pokročilého medkitu a v nabídce zvolte 'Použít Medkit'.{NEWLINE}UZDRAVIT> Červené části těla označují smrtelná zranění. Klikněte na zraněnou část a potom na tlačítko 'UZDRAVIT'. Vyléčí se jedno smrtelné zranění a obnoví 6 bodů zdraví.{NEWLINE}STIMULOVAT> Obnoví 15 bodů energie a může probrat omráčeného vojáka z bezvědomí. Musíte stát přímo nad jeho tělem.{NEWLINE}UTIŠIT> Obnoví morálku zraněného vojáka nejvýše o hodnotu odpovídající ztracenému zdraví.{NEWLINE}MAX. POUŽITÍ> LÉČENÍ: 9 | STIMULANT: 9 | UTIŠENÍ: 9"

  STR_ELERIUM_STUN_ROD: "Eleriový elektrický obušek"
  STR_ELERIUM_STUN_ROD_UFOPEDIA: "Použití energetických článků s Eleriem-115 jako zdroje elektrické energie nám umožnilo zesílit výboj předávaný nepříteli. Zařízení lze použít jen v boji zblízka, ale elektrickým šokem omráčí živý organismus, aniž by jej zabilo."

  STR_FLASHBANG_GRENADE: "Zábleskový granát"
  STR_FLASHBANG_GRENADE_UFOPEDIA: "Běžný zábleskový granát využívá prudký hluk a světlo k vyřazení cíle z boje. Hodí se k odklizení civilistů z cesty nebo při pokusu zajmout nepřítele živého."

  STR_INC_GRENADE: "Zápalný granát"
  STR_INC_GRENADE_UFOPEDIA: "Zápalné granáty jsou neocenitelné k osvětlení noci a odstraňování obtížné vegetace. Pamatujte, že oheň se může šířit a bývá velmi účinný proti velkým nepřátelským jednotkám."

  STR_ALIEN_PROXY_GRENADE: "Cizácká mina"
  STR_ALIEN_PROXY_GRENADE_UFOPEDIA: "Jakmile jsme pochopili vnitřní mechanismus roznětky Cizáckého granátu, dokázali jsme ji nahradit standardním bezdotykovým detonátorem. Naši vojáci tak mohou připravovat ničivější léčky na cizácké protivníky."

  STR_STUN_GRENADE: "Omračující granát"
  STR_STUN_GRENADE_UFOPEDIA: "Upravenou Ochromující bombu lze nyní házet jako granát a zachovává stejný omračující účinek. K výrobě potřebujeme Ochromující bomby."

  STR_FIRE_GRENADE: "Ohnivý granát"
  STR_FIRE_GRENADE_UFOPEDIA: "Upravenou Ohnivou bombu lze nyní házet jako granát. Jde o zápalnou zbraň cizáckého původu. K výrobě potřebujeme Ohnivé bomby."

  STR_FIRE_EXTINGUISHER: "Hasicí přístroj"
  STR_FIRE_EXTINGUISHER_UFOPEDIA: "Hasicí přístroj je prostředek aktivní požární ochrany určený k hašení nebo omezení malých požárů, zejména v nouzových situacích. Není určen k zásahu proti nezvládnutému požáru, který dosáhl stropu, ohrožuje uživatele například zablokovanou únikovou cestou, kouřem či nebezpečím výbuchu nebo jinak vyžaduje zásah hasičů."

  STR_PLASMA_BLADE: "Plazmové ostří"
  STR_PLASMA_BLADE_UFOPEDIA: "Toto zařízení je v podstatě cizácký vojenský nůž s ostřím vybroušeným na monomolekulární úroveň. Magnetický obal kolem čepele vytváří plazmové pole, díky němuž dokáže proříznout žáruvzdorné keramické vložky moderních zbrojí.{NEWLINE}Hodnota síly uživatele se v plné výši přičítá ke způsobenému poškození."
  STR_PLASMA_SWORD: "Plazmový meč"
  STR_PLASMA_SWORD_UFOPEDIA: "Tato smrtící zbraň spojuje velkou čepel s ostřím silným pouhý mikrometr, plazmový emitor a elektromagnet. Po aktivaci zaplní horké plazma elektromagnetické pole kolem čepele a rozpálí ji natolik, že při dotyku nechá titan téct jako vodu.{NEWLINE}Hodnota síly uživatele se v plné výši přičítá ke způsobenému poškození."

  STR_PLASMA_PISTOL_ELERIUM_CLIP: "Eleriový zásobník plazmové pistole"
  STR_PLASMA_PISTOL_ELERIUM_CLIP_UFOPEDIA: "Vylepšený zdroj energie pro malou cizáckou Plazmovou pistoli. Obsahuje neznámé a nenapodobitelné prostorové uspořádání Eleria-115, které je zdrojem veškeré cizácké energie."
  STR_PLASMA_PISTOL_MANU_UNLOCK: "Libovolný zásobník plazmové pistole"

  STR_PLASMA_RIFLE_ELERIUM_CLIP: "Eleriový zásobník plazmové pušky"
  STR_PLASMA_RIFLE_ELERIUM_CLIP_UFOPEDIA: "Jeden ze dvou druhů munice, které přijímá Plazmová puška. Poskytuje vyšší palebnou sílu a vypouští dávku antihmoty ničící vše, čeho se dotkne. Obsahuje velké množství Eleria-115."
  STR_PLASMA_RIFLE_MANU_UNLOCK: "Libovolný zásobník plazmové pušky"

  STR_HEAVY_PLASMA_ELERIUM_CLIP: "Eleriový zásobník plazmového kulometu"
  STR_HEAVY_PLASMA_ELERIUM_CLIP_UFOPEDIA: "Tato vylepšená munice pro Plazmový kulomet využívá přímo Elerium-115 ve zvláštním prostorovém uspořádání. Má obrovskou ničivou sílu a obsahuje velmi velké množství Eleria-115."
  STR_HEAVY_PLASMA_MANU_UNLOCK: "Libovolný zásobník plazmového kulometu"

  STR_PLASMA_SHOTGUN: "Plazmová brokovnice"
  STR_PLASMA_SHOTGUN_CLIP: "Náboje do plazmové brokovnice"
  STR_PLASMA_SHOTGUN_ELERIUM_CLIP: "Eleriové náboje do plazmové brokovnice"
  STR_PLASMA_SHOTGUN_UFOPEDIA: "Zpočátku nás tato zbraň mátla, ale laboratorní zkoušky ukázaly, že její poměrně rozptýlený paprsek je zblízka mimořádně ničivý, zatímco na velkou vzdálenost rychle ztrácí účinnost."
  STR_PLASMA_SHOTGUN_CLIP_UFOPEDIA: "Jeden ze dvou druhů munice, které přijímá Plazmová brokovnice. Při použití vytvoří silný výboj plazmové energie. Obsahuje malé množství Eleria-115."
  STR_PLASMA_SHOTGUN_ELERIUM_CLIP_UFOPEDIA: "Jeden ze dvou druhů munice, které přijímá Plazmová brokovnice. Při použití vypustí dávku antihmoty ničící vše, čeho se dotkne. Obsahuje velké množství Eleria-115 ve zvláštním prostorovém uspořádání."
  STR_PLASMA_SHOTGUN_MANU_UNLOCK: "Libovolné náboje do plazmové brokovnice"

  STR_PLASMA_SNIPER_RIFLE: "Plazmová odstřelovací puška"
  STR_PLASMA_SNIPER_RIFLE_CLIP: "Zás. plazmové odstřelovačky"
  STR_PLASMA_SNIPER_RIFLE_ELERIUM_CLIP: "Eleriový zásobník plazmové odstřelovací pušky"
  STR_PLASMA_SNIPER_RIFLE_UFOPEDIA: "Tato velice přesná a účinná zbraň je založena na urychlování částic uvnitř krátkodobého antigravitačního pole."
  STR_PLASMA_SNIPER_RIFLE_CLIP_UFOPEDIA: "Tento malý předmět slouží jako zdroj energie pro Plazmovou odstřelovací pušku, přesnou cizáckou zbraň. Obsahuje malé množství Eleria-115."
  STR_PLASMA_SNIPER_RIFLE_ELERIUM_CLIP_UFOPEDIA: "Tato munice pro Plazmovou odstřelovací pušku využívá přímo Elerium-115 ve zvláštním prostorovém uspořádání. Má obrovskou ničivou sílu a obsahuje velké množství Eleria-115."
  STR_PLASMA_SNIPER_RIFLE_MANU_UNLOCK: "Libovolný zásobník plazmové odstřelovací pušky"

  STR_SMALL_LAUNCHER_UFOPEDIA: "Kompaktní, ale silný cizácký odpalovač využitelný v mnoha bojových situacích. Všestranná a smrtící zbraň, cizácká obdoba ručního dělostřelectva."
  STR_ELERIUM_BOMB: "Eleriová bomba"
  STR_ELERIUM_BOMB_UFOPEDIA: "Eleriová bomba, kterou cizáci používají ve všech bojových situacích, je silná a smrtící munice pro Malý odpalovač. Způsobuje vysoké plošné explozivní poškození."
  STR_FIRE_BOMB: "Ohnivá bomba"
  STR_FIRE_BOMB_UFOPEDIA: "Ohnivá bomba je cizácká úprava Eleriové bomby. Místo explozivního poškození vytváří v určitém okruhu nesmírný žár, které spálí vše živé. Malý odpalovač se tak v podstatě mění ve zbraň pro pyromany."
  STR_SMOKE_BOMB: "Kouřová bomba"
  STR_SMOKE_BOMB_UFOPEDIA: "Kouřová bomba vytváří na bojišti kouřovou clonu pro naše jednotky. Pamatujte, že kouř může být výhodou i nevýhodou!"
#END WEAPONS

#BEGIN STORY ITEMS
  STR_ALIEN_DATA_SLATE: "Cizácká datová tabulka"
  STR_ALIEN_DATA_SLATE_UFOPEDIA: "Prozkoumání této tabulky a překlad uložených dat prohloubily naše chápání cizáckých technologií. Přelomové výsledky lze očekávat zejména v optice. Objevili jsme také stopy po ještě rozsáhlejším zdroji cizáckých znalostí, předmětu, jehož název lze přibližně přeložit jako Cizácké datové jádro. Mohl by obsahovat podrobné informace o cizáckých zbraních, a proto jej musíme získat za každou cenu. Předpokládáme, že se nachází na nejnebezpečnějších UFO, s nimiž se setkáváme."

  STR_ALIEN_DATA_CORE: "Cizácké datové jádro"
  STR_ALIEN_DATA_CORE_UFOPEDIA: "Tento předmět obsahuje nesmírné množství informací, především specifikace cizáckých plazmových zbraní a způsobů výroby a ukládání energie. Konečně díky nim dokážeme plně pochopit funkci těchto zbraní. Rovnice plazmových polí jsou velmi složité a zřejmě se liší pro každou zbraň. K jejich vyřešení potřebujeme podrobnější znalosti konkrétních technických částí. Cizáci s technickými schopnostmi by zde mohli přinést zásadní průlom."
#END STORY ITEMS

