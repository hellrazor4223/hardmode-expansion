  STR_MUTON_ELITE_GUARD_UFOPEDIA: "Elita mezi elitou: nejsilnější, nejodolnější a nejchytřejší válečníci mutonské rasy zřejmě získávají zvláštní postavení v rámci Starspawnů. Jsou značně odolní vůči psionickému působení a zatím nevíme, jak je jejich etheralští páni udržují pod kontrolou. Máme podezření na nějakou formu indoktrinace oddanosti nebo na drogu, která zajišťuje jejich poslušnost."
