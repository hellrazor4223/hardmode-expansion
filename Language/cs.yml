  STR_WASPITE_AUTOPSY: "Pitva vosáka"
  STR_WASPITE_AUTOPSY_UFOPEDIA: "Anatomie tohoto tvora hraničí se šílenstvím. Tělo tvoří spirálovité zařízení pro podporu života spojené se symbiotickou, bioinženýrsky vytvořenou rostlinou. K tělu je naroubována dvojice mechanických paží a hmyzí hlava tvora, která je patrně jediným pozůstatkem původního druhu. Rostlinná část těla je zranitelná ohněm."

