  STR_GAZER_AUTOPSY: "Pitva zírače"
  STR_GAZER_AUTOPSY_UFOPEDIA: "Nejnápadnějším anatomickým rysem tohoto cizáka je jediné velké oko. Tvor vykazuje znaky korýšů, ale je mnohem vyvinutější. Velmi silný pancíř není pouhou zbrojí: vycházejí z něj kybernetické implantáty napojené na orgány tvora a tvoří jeho tělesnou schránku."

